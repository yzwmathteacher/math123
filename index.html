<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大湾区全科智能刷题系统</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background: linear-gradient(135deg, #f7f8fa 0%, #eef2f5 100%);
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            max-width: 500px;
            margin: auto;
        }
        .card {
            background: #fff;
            border-radius: 20px;
            padding: 25px;
            margin: 12px 0;
            box-shadow: 0 10px 30px rgba(0,20,60,0.08);
        }
        .title {
            font-size: 22px;
            font-weight: bold;
            color: #2d3748;
            text-align: center;
            margin-bottom: 20px;
        }
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            margin: 8px 0;
            background: #4361ee;
            color: #fff;
            cursor: pointer;
        }
        .btn-success {
            background: #10b981;
        }
        .btn-light {
            background: #f1f5f9;
            color: #4361ee;
        }
        .input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            margin: 8px 0;
            font-size: 15px;
            background: #fafbfc;
        }
        .text-center {
            text-align: center;
        }
        .red {
            color: #ef4444;
        }
        .tip {
            font-size: 12px;
            color: #9ca3af;
            text-align: center;
            margin-top: 10px;
        }
        .price-item {
            padding: 12px 16px;
            background: #f9fafb;
            border-radius: 12px;
            margin: 6px 0;
            font-size: 15px;
        }
        .qrcode {
            width: 180px;
            margin: 15px auto;
            border-radius: 12px;
            display: block;
        }
        .math-tool {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 10px 0;
        }
        .math-btn {
            padding: 8px 10px;
            background: #e0e7ff;
            border: none;
            border-radius: 8px;
            color: #4361ee;
        }
        .tab {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
        }
        .tab button {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            border: none;
            background: #f1f5f9;
        }
        .tab button.active {
            background: #4361ee;
            color: #fff;
        }
        .hide {
            display: none;
        }
        .import-box {
            border: 2px dashed #cbd5e1;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            margin: 10px 0;
        }
    </style>
</head>
<body>
<div class="container" id="app"></div>
<script>
const ADMIN_PASS = "awedsr134793";
const WECHAT_ID = "475589411";
const PAY_QR_URL = "wx.png";
const CODE_CONFIG = { "YZW2026": { type: "永久", days: 99999 } };

let users = JSON.parse(localStorage.getItem("users")) || [];
let papers = JSON.parse(localStorage.getItem("papers")) || [];
let questions = JSON.parse(localStorage.getItem("questions")) || [];
let wrongBooks = JSON.parse(localStorage.getItem("wrongBooks")) || [];

let currentUser = null;
let nowPaperId = 0;
let tempImage = "";

const MATH_TOOLS = [
    { name: "×", val: "\\times" },
    { name: "÷", val: "\\div" },
    { name: "=", val: "=" },
    { name: "≠", val: "\\neq" },
    { name: "½", val: "\\frac{1}{2}" },
    { name: "⅓", val: "\\frac{1}{3}" },
    { name: "分数", val: "\\frac{}{}" },
    { name: "平方", val: "^2" },
    { name: "根号", val: "\\sqrt{}" },
    { name: "π", val: "\\pi" }
];

function insertToTextarea(id, val) {
    let el = document.getElementById(id);
    el.value += val;
    el.focus();
}

function renderMathTools(targetId) {
    let html = `<div class="math-tool">`;
    MATH_TOOLS.forEach(m => {
        html += `<button class="math-btn" onclick="insertToTextarea('${targetId}','${m.val}')">${m.name}</button>`;
    });
    return html + `</div>`;
}

function saveData() {
    localStorage.setItem("users", JSON.stringify(users));
    localStorage.setItem("papers", JSON.stringify(papers));
    localStorage.setItem("questions", JSON.stringify(questions));
    localStorage.setItem("wrongBooks", JSON.stringify(wrongBooks));
}

function getNowDay() {
    return Math.floor(Date.now() / 86400000);
}

// ====================== 首页 ======================
function renderHome() {
    app.innerHTML = `
    <div class="card">
        <div class="title">全科智能刷题系统</div>
        <button class="btn" onclick="renderLogin()">学生登录</button>
        <button class="btn" onclick="renderRegister()">注册账号</button>
        <button class="btn btn-light" onclick="renderAdminLogin()">教师后台</button>
        <div class="tip">无邀请码请联系管理员付费开通</div>
    </div>`;
}

// ====================== 注册 ======================
function renderRegister() {
    app.innerHTML = `
    <div class="card">
        <div class="title">账号注册</div>
        <input class="input" id="regUser" placeholder="账号">
        <input class="input" id="regPwd" type="password" placeholder="密码">
        <input class="input" id="regName" placeholder="姓名">
        <input class="input" id="regGrade" placeholder="年级">
        <input class="input" id="regCode" placeholder="邀请码">
        <button class="btn" onclick="doRegister()">立即注册</button>
        <button class="btn btn-light" onclick="renderPay()">付费开通会员</button>
        <button class="btn btn-light" onclick="renderHome()">返回</button>
    </div>`;
}

function doRegister() {
    let u = document.getElementById("regUser").value.trim();
    let p = document.getElementById("regPwd").value.trim();
    let n = document.getElementById("regName").value.trim();
    let g = document.getElementById("regGrade").value.trim();
    let c = document.getElementById("regCode").value.trim();
    if (!u || !p || !n || !g || !c) return alert("请填写完整信息！");
    if (users.find(x => x.username === u)) return alert("账号已存在！");
    if (!CODE_CONFIG[c]) return alert("邀请码无效！");
    users.push({
        username: u, password: p, name: n, grade: g, inviteCode: c,
        regDay: getNowDay(), validDays: CODE_CONFIG[c].days, disabled: false
    });
    saveData();
    alert("注册成功！");
    renderLogin();
}

// ====================== 登录 ======================
function renderLogin() {
    app.innerHTML = `
    <div class="card">
        <div class="title">用户登录</div>
        <input class="input" id="logUser" placeholder="账号">
        <input class="input" id="logPwd" type="password" placeholder="密码">
        <button class="btn" onclick="doLogin()">登录</button>
        <button class="btn btn-light" onclick="renderHome()">返回</button>
    </div>`;
}

function doLogin() {
    let u = document.getElementById("logUser").value.trim();
    let p = document.getElementById("logPwd").value.trim();
    let user = users.find(x => x.username === u && x.password === p);
    if (!user) return alert("账号或密码错误");
    if (user.disabled) return alert("账号已被禁用");
    if (getNowDay() - user.regDay > user.validDays) return alert("会员已过期");
    currentUser = user;
    renderStudentMain();
}

// ====================== 学生中心 ======================
function renderStudentMain() {
    let left = currentUser.validDays - (getNowDay() - currentUser.regDay);
    app.innerHTML = `
    <div class="card">
        <div class="title">欢迎，${currentUser.name}</div>
        <div class="text-center" style="margin-bottom:15px">剩余会员天数：<b class="red">${left > 0 ? left : 0}</b> 天</div>
        <button class="btn" onclick="renderPaperListBySub('math')">数学刷题</button>
        <button class="btn" onclick="renderPaperListBySub('chinese')">语文刷题</button>
        <button class="btn" onclick="renderPaperListBySub('english')">英语刷题</button>
        <button class="btn btn-light" onclick="renderWrongBook()">错题本</button>
        <button class="btn btn-light" onclick="renderHome()">退出登录</button>
    </div>`;
}

function renderPaperListBySub(sub) {
    let list = papers.filter(p => p.subject === sub);
    let h = `<div class="card"><div class="title">试卷列表</div>`;
    list.forEach(p => {
        h += `<button class="btn" onclick="startExam(${p.id})">${p.title}</button>`;
    });
    h += `<button class="btn btn-light" onclick="renderStudentMain()">返回</button></div>`;
    app.innerHTML = h;
}

function startExam(pid) {
    let qs = questions.filter(q => q.paper_id === pid);
    let h = `<div class="card"><div class="title">开始答题</div>`;
    qs.forEach((q, i) => {
        h += `<div style="margin:12px 0">
            <div>${i + 1}. <span class="mj-parse">${q.content}</span></div>`;
        if (q.image) h += `<img src="${q.image}" style="max-width:100%;border-radius:10px;margin:5px 0">`;
        if (q.type == 1 || q.type == 2) {
            h += `<div style="padding:5px 10px">A. ${q.options[0]}</div>`;
            h += `<div style="padding:5px 10px">B. ${q.options[1]}</div>`;
            h += `<div style="padding:5px 10px">C. ${q.options[2]}</div>`;
            h += `<div style="padding:5px 10px">D. ${q.options[3]}</div>`;
        }
        if (q.type == 3) h += `<div style="padding:5px 0">○ 对　　○ 错</div>`;
        if (q.type == 4) h += `<input class="input" placeholder="请输入答案">`;
        h += `</div>`;
    });
    h += `<button class="btn btn-success" onclick="alert('提交成功');renderStudentMain()">提交试卷</button></div>`;
    app.innerHTML = h;
    MathJax.typeset();
}

function renderWrongBook() {
    app.innerHTML = `
    <div class="card">
        <div class="title">错题本</div>
        <div class="text-center">暂无错题</div>
        <button class="btn btn-light" onclick="renderStudentMain()">返回</button>
    </div>`;
}

// ====================== 付费页面 ======================
function renderPay() {
    app.innerHTML = `
    <div class="card">
        <div class="title">会员开通</div>
        <div class="price-item">✅ 体验会员 —— 9.9 元</div>
        <div class="price-item">✅ 月会员 —— 38 元</div>
        <div class="price-item">✅ 季度会员 —— 68 元</div>
        <div class="price-item">✅ 年度会员 —— 128 元</div>
        <div class="price-item">✅ 永久会员 —— 199 元</div>
        <img src="${PAY_QR_URL}" class="qrcode">
        <div class="text-center" style="font-size:16px;font-weight:bold">微信：${WECHAT_ID}</div>
        <div class="tip">付款后联系管理员获取邀请码</div>
        <button class="btn btn-light" onclick="renderHome()">返回</button>
    </div>`;
}

// ====================== 教师后台（完整原版功能） ======================
function renderAdminLogin() {
    app.innerHTML = `
    <div class="card">
        <div class="title">教师后台登录</div>
        <input class="input" id="adminPwd" type="password" placeholder="请输入管理员密码">
        <button class="btn" onclick="checkAdminLogin()">登录</button>
        <button class="btn btn-light" onclick="renderHome()">返回</button>
    </div>`;
}

function checkAdminLogin() {
    if (document.getElementById("adminPwd").value === ADMIN_PASS) renderAdminMain();
    else alert("密码错误");
}

function renderAdminMain() {
    app.innerHTML = `
    <div class="card">
        <div class="title">管理中心</div>
        <button class="btn" onclick="adminCreatePaper()">新建试卷</button>
        <button class="btn" onclick="adminPaperList()">试卷/题目管理</button>
        <button class="btn" onclick="adminBatchImport()">批量导入试题</button>
        <button class="btn" onclick="adminPicPage()">图片题目</button>
        <button class="btn" onclick="adminUserList()">用户管理</button>
        <button class="btn" onclick="adminCreateInvite()">生成邀请码</button>
        <button class="btn btn-success" onclick="importFile()">📁 微信文件导入出题</button>
        <button class="btn btn-light" onclick="renderHome()">退出</button>
    </div>`;
}

// ====================== 试卷管理 ======================
function adminCreatePaper() {
    let name = prompt("输入试卷名称");
    let sub = prompt("科目：math / chinese / english");
    if (!name || !["math", "chinese", "english"].includes(sub)) return;
    papers.push({ id: Date.now(), title: name, subject: sub });
    saveData();
    alert("创建成功！");
    adminPaperList();
}

function adminPaperList() {
    let h = `<div class="card"><div class="title">试卷列表</div>`;
    papers.forEach(p => {
        h += `<button class="btn" onclick="adminManagePaper(${p.id})">${p.title}</button>`;
    });
    h += `<button class="btn btn-light" onclick="renderAdminMain()">返回</button></div>`;
    app.innerHTML = h;
}

// ====================== 智能出题界面 ======================
function adminManagePaper(pid) {
    nowPaperId = pid;
    let list = questions.filter(q => q.paper_id === pid);
    let h = `<div class="card"><div class="title">题目管理</div>`;
    h += `
    <div class="tab">
        <button onclick="tab(1)" id="t1" class="active">单选题</button>
        <button onclick="tab(2)" id="t2">多选题</button>
        <button onclick="tab(3)" id="t3">判断题</button>
        <button onclick="tab(4)" id="t4">填空题</button>
    </div>

    <div id="type1">
        ${renderMathTools("qContent")}
        <textarea class="input" id="qContent" placeholder="题目"></textarea>
        <input class="input" id="optA" placeholder="选项A">
        <input class="input" id="optB" placeholder="选项B">
        <input class="input" id="optC" placeholder="选项C">
        <input class="input" id="optD" placeholder="选项D">
        <input class="input" id="qAns" placeholder="答案">
    </div>

    <div id="type2" class="hide">
        ${renderMathTools("qContent2")}
        <textarea class="input" id="qContent2" placeholder="题目"></textarea>
        <input class="input" id="optA2" placeholder="选项A">
        <input class="input" id="optB2" placeholder="选项B">
        <input class="input" id="optC2" placeholder="选项C">
        <input class="input" id="optD2" placeholder="选项D">
        <input class="input" id="qAns2" placeholder="答案">
    </div>

    <div id="type3" class="hide">
        ${renderMathTools("qContent3")}
        <textarea class="input" id="qContent3" placeholder="题目"></textarea>
        <input class="input" id="qAns3" placeholder="答案（对/错）">
    </div>

    <div id="type4" class="hide">
        ${renderMathTools("qContent4")}
        <textarea class="input" id="qContent4" placeholder="题目"></textarea>
        <input class="input" id="qAns4" placeholder="答案">
    </div>

    <button class="btn btn-success" onclick="saveSmartQ()">💾 一键保存</button>
    <button class="btn btn-light" onclick="adminPaperList()">返回</button>
    <div style="margin-top:20px">`;
    list.forEach(q => {
        h += `<div style="padding:10px;border-bottom:1px solid #eee">
            <span class="mj-parse">${q.content}</span><br>
            <small>答案：${q.answer}</small>
        </div>`;
    });
    h += `</div></div>`;
    app.innerHTML = h;
    MathJax.typeset();
}

function tab(n) {
    document.querySelectorAll("#type1,#type2,#type3,#type4").forEach(e => e.classList.add("hide"));
    document.querySelectorAll(".tab button").forEach(e => e.classList.remove("active"));
    document.getElementById("type" + n).classList.remove("hide");
    document.getElementById("t" + n).classList.add("active");
}

function saveSmartQ() {
    let type = document.querySelector(".tab button.active").innerText;
    let content, optA, optB, optC, optD, ans;

    if (type.includes("单选")) {
        content = document.getElementById("qContent").value;
        optA = document.getElementById("optA").value;
        optB = document.getElementById("optB").value;
        optC = document.getElementById("optC").value;
        optD = document.getElementById("optD").value;
        ans = document.getElementById("qAns").value;
        questions.push({
            id: Date.now(), paper_id: nowPaperId, type: 1,
            content: content, options: [optA, optB, optC, optD], answer: ans, image: ""
        });
    }

    if (type.includes("多选")) {
        content = document.getElementById("qContent2").value;
        optA = document.getElementById("optA2").value;
        optB = document.getElementById("optB2").value;
        optC = document.getElementById("optC2").value;
        optD = document.getElementById("optD2").value;
        ans = document.getElementById("qAns2").value;
        questions.push({
            id: Date.now(), paper_id: nowPaperId, type: 2,
            content: content, options: [optA, optB, optC, optD], answer: ans, image: ""
        });
    }

    if (type.includes("判断")) {
        content = document.getElementById("qContent3").value;
        ans = document.getElementById("qAns3").value;
        questions.push({
            id: Date.now(), paper_id: nowPaperId, type: 3,
            content: content, options: [], answer: ans, image: ""
        });
    }

    if (type.includes("填空")) {
        content = document.getElementById("qContent4").value;
        ans = document.getElementById("qAns4").value;
        questions.push({
            id: Date.now(), paper_id: nowPaperId, type: 4,
            content: content, options: [], answer: ans, image: ""
        });
    }

    saveData();
    alert("出题成功！");
    adminManagePaper(nowPaperId);
}

// ====================== 原版完整功能：批量导入 ======================
function adminBatchImport() {
    app.innerHTML = `
    <div class="card">
        <div class="title">批量导入</div>
        <div class="tip">格式：题型|题目|A|B|C|D|答案</div>
        <textarea class="input" rows="6" id="batchText"></textarea>
        <button class="btn btn-success" onclick="doBatch()">导入</button>
        <button class="btn btn-light" onclick="renderAdminMain()">返回</button>
    </div>`;
}

function doBatch() {
    let t = document.getElementById("batchText").value.trim();
    if (!t) return;
    t.split('\n').forEach(line => {
        let a = line.split('|');
        questions.push({
            id: Date.now(), paper_id: nowPaperId,
            subject: papers.find(x => x.id === nowPaperId).subject,
            type: Number(a[0]), content: a[1],
            options: [a[2], a[3], a[4], a[5]], answer: a[6], image: ""
        });
    });
    saveData();
    alert("导入成功！");
    renderAdminMain();
}

// ====================== 原版完整功能：图片题目 ======================
function adminPicPage() {
    tempImage = "";
    app.innerHTML = `
    <div class="card">
        <div class="title">上传图片题目</div>
        <input type="file" accept="image/*" onchange="previewImg(event)">
        <button class="btn btn-success" onclick="editPicQuestion()">下一步</button>
        <button class="btn btn-light" onclick="renderAdminMain()">返回</button>
    </div>`;
}

function previewImg(e) {
    let f = new FileReader();
    f.onload = ev => { tempImage = ev.target.result; };
    f.readAsDataURL(e.target.files[0]);
}

function editPicQuestion() {
    app.innerHTML = `
    <div class="card">
        <div class="title">编辑图片题目</div>
        ${renderMathTools("qContent")}
        <textarea class="input" id="qContent" placeholder="题目描述"></textarea>
        <input class="input" id="qAns" placeholder="正确答案">
        <button class="btn btn-success" onclick="savePicQ()">保存</button>
    </div>`;
}

function savePicQ() {
    questions.push({
        id: Date.now(), paper_id: prompt("输入试卷ID"),
        subject: "math", type: 1,
        content: document.getElementById("qContent").value,
        options: [], answer: document.getElementById("qAns").value,
        image: tempImage
    });
    saveData();
    alert("保存成功！");
    renderAdminMain();
}

// ====================== 原版完整功能：用户管理 ======================
function adminUserList() {
    let h = `<div class="card"><div class="title">用户列表</div>`;
    users.forEach(u => {
        h += `<div style="padding:8px 0;border-bottom:1px solid #eee">${u.username}（${u.name}）</div>`;
    });
    h += `<button class="btn btn-light" onclick="renderAdminMain()">返回</button></div>`;
    app.innerHTML = h;
}

// ====================== 原版完整功能：邀请码 ======================
function adminCreateInvite() {
    let code = "VIP" + Math.random().toString().slice(-6);
    CODE_CONFIG[code] = { days: 365 };
    alert("邀请码：" + code);
    renderAdminMain();
}

// ====================== 新增：微信文件导入出题 ======================
function importFile() {
    app.innerHTML = `
    <div class="card">
        <div class="title">微信文件导入出题</div>
        <div class="import-box">
            <div>📁 选择微信文件</div>
            <input type="file" id="file" style="margin-top:15px">
            <div class="tip">支持 txt 文本</div>
        </div>
        <button class="btn btn-success" onclick="readFile()">✅ 导入并生成题目</button>
        <button class="btn btn-light" onclick="renderAdminMain()">返回</button>
    </div>`;
}

function readFile() {
    let file = document.getElementById("file").files[0];
    if (!file) return alert("请选择文件");
    let reader = new FileReader();
    reader.onload = function (e) {
        let text = e.target.result;
        text.split('\n').forEach(line => {
            if (line.trim().length < 3) return;
            let arr = line.split('|');
            questions.push({
                id: Date.now(), paper_id: nowPaperId,
                type: 1, content: arr[0] || "",
                options: [arr[1] || "", arr[2] || "", arr[3] || "", arr[4] || ""],
                answer: arr[5] || ""
            });
        });
        saveData();
        alert("导入完成！");
        renderAdminMain();
    }
    reader.readAsText(file);
}

renderHome();
</script>
</body>
</html>
