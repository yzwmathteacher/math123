<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大湾区全科智能刷题系统 | 官方平台</title>
    <style>
        *{box-sizing:border-box}
        body{background:#f5f7fa;margin:0;padding:15px;font-family:Arial,"微软雅黑"}
        .container{max-width:500px;margin:0 auto}
        .card{background:white;border-radius:16px;padding:25px;margin:15px 0;box-shadow:0 2px 10px #00000010}
        .title{text-align:center;font-size:22px;font-weight:bold;margin-bottom:20px;color:#2c52ed}
        .sub-title{text-align:center;font-size:14px;color:#999;margin-bottom:15px}
        input,select{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;font-size:15px}
        button{width:100%;padding:13px;background:#2c52ed;color:white;border:none;border-radius:8px;font-size:16px;margin-top:8px}
        .btn-outline{background:white;color:#2c52ed;border:1px solid #2c52ed}
        .text-center{text-align:center}
        .mt10{margin-top:10px}
        .red{color:red}
        .green{color:green}
        .blue{color:#2c52ed}
        .gray{color:#999}
        .tip{font-size:12px;color:#666;margin-top:5px}
        .pay-qrcode{width:200px;border-radius:8px;margin:10px auto;display:block}
        table{width:100%;border-collapse:collapse;font-size:12px;margin:10px 0}
        th,td{border:1px solid #eee;padding:6px;text-align:center}
        th{background:#f5f7fa}
        .tag{display:inline-block;padding:3px 8px;border-radius:4px;font-size:12px;color:#fff;margin:2px}
        .tag-sx{background:#2c52ed}
        .tag-yw{background:#4CAF50}
        .tag-yy{background:#ff9800}
        .popup{position:fixed;top:0;left:0;width:100%;height:100%;background:#00000077;display:flex;align-items:center;justify-content:center;padding:20px;z-index:999}
        .popup-card{background:white;border-radius:16px;padding:20px;max-width:400px;width:100%}
    </style>
</head>
<body>
    <div class="container" id="app"></div>

    <script>
        // ==================== 配置区（自行修改）====================
        const ADMIN_PASS = "yzw134793";
        const WECHAT_ID = "475589411";
        // 系统公告（可随时改）
        const SYS_NOTICE = "欢迎使用全科智能刷题系统！\n付费请联系管理员微信，切勿私下转账。";

        // 邀请码对应套餐时效
        const CODE_CONFIG = {
            "YZW2026":   { type:"内部永久会员", days: 99999 },
            "TIYAN2026": { type:"30天体验会员", days: 30 },
            "YUE2026":   { type:"月度会员", days: 30 },
            "NIAN2026":  { type:"年度会员", days: 365 }
        };

        // 学科列表
        const SUBJECT_LIST = [
            {key:"math", name:"数学", cls:"tag-sx"},
            {key:"chinese", name:"语文", cls:"tag-yw"},
            {key:"english", name:"英语", cls:"tag-yy"}
        ];

        // 本地存储数据
        let users = JSON.parse(localStorage.getItem("users")) || [];
        let papers = JSON.parse(localStorage.getItem("papers")) || [];
        let questions = JSON.parse(localStorage.getItem("questions")) || [];
        let wrongBooks = JSON.parse(localStorage.getItem("wrongBooks")) || [];
        let currentUser = null;

        // 获取当前时间天数
        function getNowDay(){
            return Math.floor(Date.now() / (1000*60*60*24));
        }

        // 天数转日期
        function dayToDate(dayNum){
            let timestamp = dayNum * 1000*60*60*24;
            let d = new Date(timestamp);
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }

        // 保存本地数据
        function saveData(){
            localStorage.setItem("users",JSON.stringify(users));
            localStorage.setItem("papers",JSON.stringify(papers));
            localStorage.setItem("questions",JSON.stringify(questions));
            localStorage.setItem("wrongBooks",JSON.stringify(wrongBooks));
        }

        // 弹出系统公告
        function showNotice(){
            let html = `
            <div class="popup" onclick="closeNotice(event)">
                <div class="popup-card" onclick="event.stopPropagation()">
                    <div class="title">系统公告</div>
                    <div style="white-space:pre-line;text-align:center;line-height:1.8">${SYS_NOTICE}</div>
                    <button class="mt10" onclick="closeNotice()">我已知晓</button>
                </div>
            </div>`;
            document.body.insertAdjacentHTML("beforeend",html);
        }
        function closeNotice(event){
            let pop = document.querySelector(".popup");
            if(pop) pop.remove();
        }

        // ==================== 首页 ====================
        function renderHome(){
            document.getElementById("app").innerHTML = `
            <div class="card">
                <div class="title">大湾区全科智能刷题系统</div>
                <div class="sub-title">专注大湾区中小学全科在线刷题平台</div>
                <button onclick="renderLogin()">学生登录</button>
                <button class="btn-outline mt10" onclick="renderRegister()">学生注册</button>
                <button class="btn-outline mt10" onclick="renderAdminLogin()">教师后台</button>
                <div class="text-center tip mt10">无官方邀请码请付费开通会员</div>
            </div>`;
            // 进入首页自动弹公告
            setTimeout(showNotice,300);
        }

        // ==================== 注册页面 + 非空校验 + 绑定有效期 ====================
        function renderRegister(){
            document.getElementById("app").innerHTML = `
            <div class="card">
                <div class="title">账号注册</div>
                <input id="username" placeholder="账号（必填）">
                <input id="pwd" placeholder="密码（必填）" type="password">
                <input id="name" placeholder="姓名（必填）">
                <input id="grade" placeholder="年级（必填）">
                <input id="inviteCode" placeholder="邀请码（必填）">
                <button onclick="doRegister()">立即注册</button>
                <div class="text-center mt10">
                    <span onclick="renderHome()" style="color:#2c52ed;cursor:pointer">返回首页</span>
                </div>
                <div class="text-center mt10">
                    <span onclick="renderPay()" style="color:red;cursor:pointer">没有邀请码？付费获取</span>
                </div>
            </div>`;
        }

        function doRegister(){
            let u = document.getElementById("username").value.trim();
            let p = document.getElementById("pwd").value.trim();
            let n = document.getElementById("name").value.trim();
            let g = document.getElementById("grade").value.trim();
            let code = document.getElementById("inviteCode").value.trim();

            if(!u || !p || !n || !g || !code){
                alert("所有栏目必须填写，不能为空！");
                return;
            }
            if(users.find(x=>x.username === u)){
                alert("账号已存在，请换账号");
                return;
            }
            if(!CODE_CONFIG[code]){
                alert("邀请码无效！\n请先付费获取正规邀请码");
                return;
            }

            let nowDay = getNowDay();
            let validDays = CODE_CONFIG[code].days;

            users.push({
                username:u,
                password:p,
                name:n,
                grade:g,
                inviteCode:code,
                regDay: nowDay,
                validDays: validDays,
                disabled:false
            });
            saveData();
            alert(`注册成功！\n套餐类型：${CODE_CONFIG[code].type}\n有效时长：${validDays}天`);
            renderLogin();
        }

        // ==================== 登录 + 自动过期判断 + 禁用判断 ====================
        function renderLogin(){
            document.getElementById("app").innerHTML = `
            <div class="card">
                <div class="title">用户登录</div>
                <input id="username" placeholder="账号">
                <input id="pwd" type="password" placeholder="密码">
                <button onclick="doLogin()">登录</button>
                <div class="text-center mt10">
                    <span onclick="renderRegister()" style="color:#2c52ed;cursor:pointer">没有账号？去注册</span>
                </div>
                <div class="text-center mt10">
                    <span onclick="renderPay()" style="color:red;cursor:pointer">无邀请码？开通会员</span>
                </div>
            </div>`;
        }

        function doLogin(){
            let u = document.getElementById("username").value.trim();
            let p = document.getElementById("pwd").value.trim();
            let user = users.find(x=>x.username === u && x.password === p);
            if(!user){
                alert("账号或密码错误");
                return;
            }
            if(user.disabled){
                alert("该账号已被管理员禁用，无法登录！");
                return;
            }

            let nowDay = getNowDay();
            let used = nowDay - user.regDay;
            if(used > user.validDays){
                alert("会员已过期！\n请重新付费获取邀请码续期");
                return;
            }

            currentUser = user;
            renderStudentIndex();
        }

        // ==================== 学生主页（显示到期日期 + 学科 + 错题本） ====================
        function renderStudentIndex(){
            let nowDay = getNowDay();
            let used = nowDay - currentUser.regDay;
            let left = currentUser.validDays - used;
            let endDate = dayToDate(currentUser.regDay + currentUser.validDays);

            let subHtml = "";
            SUBJECT_LIST.forEach(s=>{
                subHtml += `<button onclick="renderPaperBySubject('${s.key}')">${s.name}刷题</button>`;
            });

            document.getElementById("app").innerHTML = `
            <div class="card">
                <div class="title">欢迎 ${currentUser.name}</div>
                <div class="text-center" style="line-height:1.8">
                    年级：${currentUser.grade}<br>
                    剩余会员时长：<span class="red">${left>0?left:0}</span> 天<br>
                    会员到期日期：<span class="blue">${endDate}</span>
                </div>
                ${subHtml}
                <button class="mt10 btn-outline" onclick="renderWrongBook()">我的错题本</button>
                <button class="mt10 btn-outline" onclick="logout()">退出登录</button>
            </div>`;
        }

        // 按学科筛选试卷
        function renderPaperBySubject(subKey){
            let subInfo = SUBJECT_LIST.find(x=>x.key===subKey);
            let html = `<div class="card"><div class="title">${subInfo.name} 试卷列表</div>`;
            let list = papers.filter(p=>p.subject===subKey);
            if(list.length === 0){
                html += `<div class="text-center">暂无${subInfo.name}试卷</div>`;
            }
            list.forEach(p=>{
                html += `<button onclick="doPaper(${p.id})">${p.title}</button>`;
            });
            html += `<button class="mt10 btn-outline" onclick="renderStudentIndex()">返回</button></div>`;
            document.getElementById("app").innerHTML = html;
        }

        // ==================== 完整版错题本 ====================
        function renderWrongBook(){
            let myWrong = wrongBooks.filter(w=>w.username===currentUser.username);
            if(myWrong.length === 0){
                document.getElementById("app").innerHTML = `
                <div class="card">
                    <div class="title">我的错题本</div>
                    <div class="text-center">暂无错题</div>
                    <button class="mt10" onclick="renderStudentIndex()">返回</button>
                </div>`;
                return;
            }

            let html = `<div class="card"><div class="title">我的错题本</div>`;
            myWrong.forEach((item,idx)=>{
                let q = questions.find(x=>x.id===item.questionId);
                let subInfo = SUBJECT_LIST.find(x=>x.key===q.subject);
                html += `
                <div style="padding:10px;border-bottom:1px solid #eee">
                    <span class="tag ${subInfo.cls}">${subInfo.name}</span>
                    <div style="margin:5px 0;">${q.content}</div>
                    <div class="tip">正确答案：${q.answer}</div>
                    <button style="padding:6px;margin-top:5px" onclick="redoWrong(${item.questionId})">重做此题</button>
                </div>`;
            });

            html += `
            <button class="mt10 btn-outline" onclick="clearAllWrong()">清空全部错题</button>
            <button class="mt10 btn-outline" onclick="renderStudentIndex()">返回</button></div>`;
            document.getElementById("app").innerHTML = html;
        }

        // 重做错题
        function redoWrong(qid){
            let q = questions.find(x=>x.id===qid);
            document.getElementById("app").innerHTML = `
            <div class="card">
                <div class="title">重做错题</div>
                <div style="margin-bottom:15px">${q.content}</div>
                <input id="ansRedo" placeholder="请输入答案">
                <button onclick="checkRedo(${qid})">提交核对</button>
            </div>`;
        }

        function checkRedo(qid){
            let q = questions.find(x=>x.id===qid);
            let val = document.getElementById("ansRedo").value.trim();
            if(val === q.answer.trim()){
                alert("回答正确！已移出错题记录");
                wrongBooks = wrongBooks.filter(w=>!(w.username===currentUser.username && w.questionId===qid));
                saveData();
            }else{
                alert("答案错误，请再思考一下");
            }
            renderWrongBook();
        }

        // 清空错题
        function clearAllWrong(){
            if(!confirm("确定要清空所有错题吗？不可恢复！")) return;
            wrongBooks = wrongBooks.filter(w=>w.username!==currentUser.username);
            saveData();
            alert("已清空");
            renderWrongBook();
        }

        // ==================== 做题批改 + 自动收录错题 ====================
        function doPaper(pid){
            let qs = questions.filter(q=>q.paper_id === pid);
            if(qs.length === 0){
                alert("该试卷暂无题目");
                return;
            }
            let html = `<div class="card"><div class="title">开始答题</div>`;
            qs.forEach((q,i)=>{
                html += `<div style="margin-bottom:15px">
                <div>${q.content}</div>
                <input id="ans${i}" placeholder="输入答案">
                </div>`;
            });
            html += `<button onclick="submitPaper(${pid})">提交批改</button></div>`;
            document.getElementById("app").innerHTML = html;
        }

        function submitPaper(pid){
            let qs = questions.filter(q=>q.paper_id === pid);
            let right = 0;
            qs.forEach((q,i)=>{
                let val = document.getElementById(`ans${i}`).value.trim();
                if(val === q.answer.trim()){
                    right++;
                }else{
                    let has = wrongBooks.find(w=>w.username===currentUser.username && w.questionId===q.id);
                    if(!has){
                        wrongBooks.push({
                            username:currentUser.username,
                            questionId:q.id,
                            addTime:getNowDay()
                        });
                    }
                }
            });
            saveData();
            let score = Math.round(right / qs.length * 100);
            alert(`测评完成\n得分：${score}分\n答对：${right}题\n答错：${qs.length-right}题\n错题已自动加入错题本`);
            renderStudentIndex();
        }

        function logout(){
            currentUser = null;
            renderHome();
        }

        // ==================== 付费页面 ====================
        function renderPay(){
            document.getElementById("app").innerHTML = `
            <div class="card">
                <div class="title">会员付费开通</div>
                <div style="line-height:1.8;font-size:15px;">
                ✅ 体验30天  9.9元  邀请码：TIYAN2026<br>
                ✅ 月度会员  25元   邀请码：YUE2026<br>
                ✅ 年度会员  99元   邀请码：NIAN2026<br><br>
                <span class="red">付款备注：姓名+年级+套餐</span>
                </div>

                <div class="text-center">
                    <div style="font-weight:bold;margin:8px 0;">微信扫码</div>
                    <img src="wx.png" class="pay-qrcode">
                </div>
                <div class="text-center">
                    <div style="font-weight:bold;margin:8px 0;">支付宝扫码</div>
                    <img src="zfb.png" class="pay-qrcode">
                </div>

                <div style="font-size:12px;color:#666;text-align:center;margin-top:15px;">
                付款后加微信：<strong>${WECHAT_ID}</strong> 领取邀请码
                </div>

                <button class="mt10" onclick="renderHome()">返回首页</button>
            </div>`;
        }

        // ==================== 教师后台 ====================
        function renderAdminLogin(){
            document.getElementById("app").innerHTML = `
            <div class="card">
                <div class="title">教师后台登录</div>
                <input id="pwd" type="password" placeholder="管理员密码">
                <button onclick="checkAdmin()">登录</button>
                <div class="text-center mt10">
                    <span onclick="renderHome()" style="color:#2c52ed;cursor:pointer">返回</span>
                </div>
            </div>`;
        }

        function checkAdmin(){
            let p = document.getElementById("pwd").value.trim();
            if(p === ADMIN_PASS){
                renderAdmin();
            }else{
                alert("密码错误");
            }
        }

        function renderAdmin(){
            document.getElementById("app").innerHTML = `
            <div class="card">
                <div class="title">教师管理中心</div>
                <button onclick="createPaper()">新建试卷</button>
                <button class="mt10" onclick="showPaperList()">管理题目</button>
                <button class="mt10" onclick="showUserList()">用户列表/续期/禁用</button>
                <button class="mt10" onclick="renderCreateInvite()">生成自定义邀请码</button>
                <button class="mt10 btn-outline" onclick="renderHome()">退出</button>
            </div>`;
        }

        // 新建试卷（带学科选择）
        function createPaper(){
            let t = prompt("请输入试卷名称");
            if(!t) return;
            let subKey = prompt("请输入学科编码：\nmath=数学\nchinese=语文\nenglish=英语");
            let checkSub = SUBJECT_LIST.find(x=>x.key===subKey);
            if(!checkSub){
                alert("学科编码错误");
                return;
            }
            papers.push({id:Date.now(), title:t, subject:subKey});
            saveData();
            alert("试卷创建成功！");
            showPaperList();
        }

        // 【修复版】管理试卷列表 + 可进入题目管理
        function showPaperList(){
            let html = `<div class="card"><div class="title">试卷列表（点击添加题目）</div>`;
            if(papers.length === 0){
                html += `<div class="text-center">暂无试卷，请先新建试卷</div>`;
            }else{
                papers.forEach(p=>{
                    let subInfo = SUBJECT_LIST.find(x=>x.key===p.subject);
                    let qCount = questions.filter(q=>q.paper_id===p.id).length;
                    html += `
                    <div style="padding:10px;border-bottom:1px solid #eee">
                        <div>${p.title} <span class="tag ${subInfo.cls}">${subInfo.name}</span> （${qCount}题）</div>
                        <button style="padding:6px;margin-top:5px" onclick="manageQuestions(${p.id})">管理题目</button>
                    </div>`;
                });
            }
            html += `<button class="mt10 btn-outline" onclick="renderAdmin()">返回</button></div>`;
            document.getElementById("app").innerHTML = html;
        }

        // 【修复版】管理单套试卷的题目（增/删）
        function manageQuestions(pid){
            let paper = papers.find(p=>p.id===pid);
            let qs = questions.filter(q=>q.paper_id===pid);
            let html = `<div class="card"><div class="title">${paper.title} - 题目管理</div>`;

            // 题目列表
            if(qs.length===0){
                html += `<div class="text-center">暂无题目，请添加</div>`;
            }else{
                qs.forEach((q,idx)=>{
                    html += `
                    <div style="padding:10px;border-bottom:1px solid #eee">
                        <div><strong>题${idx+1}：</strong>${q.content}</div>
                        <div class="tip">答案：${q.answer}</div>
                        <button style="padding:6px;font-size:12px;margin-top:5px" onclick="delQuestion(${q.id})">删除</button>
                    </div>`;
                });
            }

            // 添加题目按钮
            html += `
            <button class="mt10" onclick="addQuestion(${pid})">添加新题目</button>
            <button class="mt10 btn-outline" onclick="showPaperList()">返回试卷列表</button></div>`;
            document.getElementById("app").innerHTML = html;
        }

        // 【修复版】添加题目（存入对应试卷）
        function addQuestion(pid){
            let c = prompt("题目内容（填空用___）");
            let a = prompt("标准答案");
            if(!c || !a){
                alert("题目和答案不能为空");
                return;
            }
            let paper = papers.find(p=>p.id===pid);
            questions.push({
                id:Date.now(),
                paper_id:pid,
                subject:paper.subject,
                content:c.trim(),
                answer:a.trim()
            });
            saveData();
            alert("题目添加成功！");
            manageQuestions(pid); // 刷新当前试卷题目管理页
        }

        // 删除题目
        function delQuestion(qid){
            if(!confirm("确定删除该题目？")) return;
            questions = questions.filter(q=>q.id!==qid);
            saveData();
            alert("已删除");
            // 刷新页面（从当前URL拿pid）
            let url = document.URL;
            let pid = url.match(/manageQuestions\((\d+)\)/) ? RegExp.$1 : null;
            if(pid) manageQuestions(Number(pid));
            else showPaperList();
        }

        // 查看用户 + 续期 + 重置密码 + 禁用账号
        function showUserList(){
            if(users.length === 0){
                document.getElementById("app").innerHTML = `
                <div class="card">
                    <div class="title">注册用户列表</div>
                    <div class="text-center">暂无用户注册</div>
                    <button class="mt10" onclick="renderAdmin()">返回</button>
                </div>`;
                return;
            }

            let nowDay = getNowDay();
            let html = `
            <div class="card">
                <div class="title">用户管理</div>
                <table>
                    <tr>
                        <th>姓名</th>
                        <th>年级</th>
                        <th>到期日期</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>`;

            users.forEach(u=>{
                let used = nowDay - u.regDay;
                let left = u.validDays - used;
                let endDate = dayToDate(u.regDay + u.validDays);
                let status = u.disabled ? `<span class="red">已禁用</span>` : (left>0 ? `<span class="green">正常</span>` : `<span class="red">已过期</span>`);
                html += `
                <tr>
                    <td>${u.name}</td>
                    <td>${u.grade}</td>
                    <td>${endDate}</td>
                    <td>${status}</td>
                    <td>
                        <button style="padding:3px;font-size:10px" onclick="editUserDay('${u.username}')">续期</button>
                        <button style="padding:3px;font-size:10px" onclick="resetPwd('${u.username}')">重置密码</button>
                        <button style="padding:3px;font-size:10px" onclick="toggleDisable('${u.username}')">${u.disabled?'解禁':'禁用'}</button>
                    </td>
                </tr>`;
            });

            html += `</table><button class="mt10" onclick="renderAdmin()">返回</button></div>`;
            document.getElementById("app").innerHTML = html;
        }

        // 给用户续期
        function editUserDay(uname){
            let addDay = prompt("请输入要增加的天数：");
            let num = parseInt(addDay);
            if(isNaN(num) || num<=0){
                alert("请输入正确数字");
                return;
            }
            let user = users.find(x=>x.username===uname);
            user.validDays += num;
            saveData();
            alert("续期成功！");
            showUserList();
        }

        // 重置用户密码
        function resetPwd(uname){
            let newPwd = prompt("请输入新密码：");
            if(!newPwd || newPwd.trim()==""){
                alert("密码不能为空");
                return;
            }
            let user = users.find(x=>x.username===uname);
            user.password = newPwd.trim();
            saveData();
            alert("密码重置成功！");
            showUserList();
        }

        // 禁用/解禁账号
        function toggleDisable(uname){
            let user = users.find(x=>x.username===uname);
            user.disabled = !user.disabled;
            saveData();
            alert(user.disabled?"已禁用该账号":"已解禁该账号");
            showUserList();
        }

        // 生成自定义邀请码
        function renderCreateInvite(){
            let code = "INV" + Date.now().toString().slice(-8);
            let day = prompt("请输入该邀请码有效天数：");
            let d = parseInt(day);
            if(isNaN(d)||d<=0){
                alert("天数错误");
                return;
            }
            CODE_CONFIG[code] = {type:"自定义会员", days:d};
            alert("生成成功！\n邀请码："+code+"\n有效期："+d+"天\n已自动生效");
            renderAdmin();
        }

        // 初始化首页
        renderHome();
    </script>
</body>
</html>
