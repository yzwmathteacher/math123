<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大湾区全科智能刷题系统</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        *{box-sizing:border-box}
        body{background:#f5f5f5;margin:0;padding:15px;font-family:Arial,"微软雅黑"}
        .container{max-width:500px;margin:auto}
        .card{background:white;border-radius:16px;padding:20px;margin:10px 0;box-shadow:0 2px 10px #00000010}
        .title{text-align:center;font-size:20px;font-weight:bold;margin:10px 0}
        input,textarea,select{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:8px}
        button{width:100%;padding:12px;background:#2c52ed;color:white;border:none;border-radius:8px;margin:6px 0}
        .btn-green{background:#009688;}
        .math-bar{display:flex;flex-wrap:wrap;gap:5px;margin:5px 0}
        .math-btn{padding:5px 8px;background:#eef5ff;border:none;border-radius:5px;color:#2c52ed}
        .text-center{text-align:center}
        .red{color:red}
    </style>
</head>
<body>
<div class="container" id="app"></div>
<script>
const ADMIN_PASS = "awedsr134793";
const WECHAT_ID = "475589411";
const PAY_QR_URL = "wx.png"; // 你本地付款码图片名
const CODE_CONFIG = {"YZW2026":{type:"永久",days:99999}};
const SUBJECTS = [{key:"math",name:"数学"},{key:"chinese",name:"语文"},{key:"english",name:"英语"}];

let users = JSON.parse(localStorage.getItem("users"))||[];
let papers = JSON.parse(localStorage.getItem("papers"))||[];
let questions = JSON.parse(localStorage.getItem("questions"))||[];
let currentUser = null;
let nowPaper = 0;

// 超级简单数学公式按钮
const MATH_BTNS = [
    "×","÷","=","≠","≤","≥","^2","^3","√","π","½","⅓","¼"
];

// 插入公式
function insertMath(id,val){
    let t = document.getElementById(id);
    t.value += val;
    t.focus();
}

// 生成公式按钮栏
function mathBar(id){
    let h = '<div class="math-bar">';
    MATH_BTNS.forEach(m=>{
        h+=`<button class="math-btn" onclick="insertMath('${id}','${m}')">${m}</button>`;
    });
    return h+'</div>';
}

// 保存数据
function save(){
    localStorage.setItem("users",JSON.stringify(users));
    localStorage.setItem("papers",JSON.stringify(papers));
    localStorage.setItem("questions",JSON.stringify(questions));
}

// 首页
function home(){
    html=`
    <div class="card">
        <div class="title">全科刷题系统</div>
        <button onclick="login()">学生登录</button>
        <button onclick="reg()">注册账号</button>
        <button onclick="adminLogin()">教师后台</button>
    </div>`;
    app.innerHTML=html;
}

// 登录
function login(){
    html=`
    <div class="card">
        <div class="title">登录</div>
        <input id="u" placeholder="账号">
        <input id="p" type="password" placeholder="密码">
        <button onclick="loginGo()">登录</button>
        <button onclick="home()">返回</button>
    </div>`;
    app.innerHTML=html;
}
function loginGo(){
    let u=document.getElementById("u").value;
    let p=document.getElementById("p").value;
    let user=users.find(x=>x.user==u&&x.pwd==p);
    if(!user)return alert("账号密码错误");
    currentUser=user;
    student();
}

// 注册
function reg(){
    html=`
    <div class="card">
        <div class="title">注册</div>
        <input id="u" placeholder="账号">
        <input id="p" placeholder="密码">
        <input id="name" placeholder="姓名">
        <input id="code" placeholder="邀请码">
        <button onclick="regGo()">注册</button>
        <button onclick="pay()">付费开通</button>
        <button onclick="home()">返回</button>
    </div>`;
    app.innerHTML=html;
}
function regGo(){
    let u=document.getElementById("u").value;
    let p=document.getElementById("p").value;
    let name=document.getElementById("name").value;
    let code=document.getElementById("code").value;
    if(!u||!p||!name||!code)return alert("不能为空");
    if(users.find(x=>x.user==u))return alert("已存在");
    if(!CODE_CONFIG[code])return alert("邀请码无效");
    users.push({user:u,pwd:p,name:name,day:99999});
    save();alert("注册成功");login();
}

// 学生中心
function student(){
    html=`
    <div class="card">
        <div class="title">欢迎 ${currentUser.name}</div>
        <button onclick="toExam('math')">数学刷题</button>
        <button onclick="toExam('chinese')">语文刷题</button>
        <button onclick="toExam('english')">英语刷题</button>
        <button onclick="home()">退出</button>
    </div>`;
    app.innerHTML=html;
}

// 刷题列表
function toExam(sub){
    let ps=papers.filter(x=>x.sub==sub);
    let h=`<div class="card"><div class="title">试卷</div>`;
    ps.forEach(p=>{
        h+=`<button onclick="startExam(${p.id})">${p.name}</button>`;
    });
    h+=`<button onclick="student()">返回</button></div>`;
    app.innerHTML=h;
}

// 开始考试
function startExam(pid){
    let qs=questions.filter(x=>x.pid==pid);
    let h=`<div class="card"><div class="title">开始答题</div>`;
    qs.forEach((q,i)=>{
        h+=`<div style="margin:10px 0">
            <div>${i+1}、<span class="mj-parse">${q.title}</span></div>
            <input placeholder="请输入答案">
        </div>`;
    });
    h+=`<button class="btn-green" onclick="alert('提交成功');student()">提交试卷</button></div>`;
    app.innerHTML=h;MathJax.typeset();
}

// 付款页面（带付款码）
function pay(){
    html=`
    <div class="card">
        <div class="title">会员开通</div>
        <div>✅ 永久使用：199元</div>
        <img src="${PAY_QR_URL}" style="width:180px;margin:10px auto">
        <div class="text-center">微信：${WECHAT_ID}</div>
        <button onclick="home()">返回</button>
    </div>`;
    app.innerHTML=html;
}

// 管理员登录
function adminLogin(){
    html=`
    <div class="card">
        <div class="title">教师登录</div>
        <input id="pwd" type="password" placeholder="密码">
        <button onclick="adminGo()">登录</button>
        <button onclick="home()">返回</button>
    </div>`;
    app.innerHTML=html;
}
function adminGo(){
    if(document.getElementById("pwd").value==ADMIN_PASS)admin();
    else alert("密码错误");
}

// 管理后台
function admin(){
    html=`
    <div class="card">
        <div class="title">管理中心</div>
        <button onclick="addPaper()">新建试卷</button>
        <button onclick="paperList()">管理试卷</button>
        <button onclick="home()">退出</button>
    </div>`;
    app.innerHTML=html;
}

// 新建试卷
function addPaper(){
    let name=prompt("试卷名称");
    if(!name)return;
    papers.push({id:Date.now(),name:name,sub:"math"});
    save();alert("创建成功");paperList();
}

// 试卷列表
function paperList(){
    let h=`<div class="card"><div class="title">试卷列表</div>`;
    papers.forEach(p=>{
        h+=`<button onclick="goPaper(${p.id})">${p.name}</button>`;
    });
    h+=`<button onclick="admin()">返回</button></div>`;
    app.innerHTML=h;
}

// 进入试卷 → 一键出题
function goPaper(pid){
    nowPaper=pid;
    let qs=questions.filter(x=>x.pid==pid);
    let h=`<div class="card"><div class="title">出题（超级简单）</div>`;
    
    // ==========================================
    // 【极简出题界面】只有 题目 + 公式按钮 + 答案
    // ==========================================
    h+=`
    <div>
        <div>输入题目：</div>
        ${mathBar("title")}
        <textarea id="title" placeholder="输入题目，点上面公式"></textarea>
        <input id="ans" placeholder="输入答案">
        <button class="btn-green" onclick="saveQ()">💾 一键保存题目</button>
    </div><hr>`;
    
    qs.forEach(q=>{
        h+=`<div><span class="mj-parse">${q.title}</span><br>答案：${q.ans}</div><hr>`;
    });
    h+=`<button onclick="paperList()">返回</button></div>`;
    app.innerHTML=h;MathJax.typeset();
}

// ==========================================
// 一键保存题目（最简单逻辑）
// ==========================================
function saveQ(){
    let title=document.getElementById("title").value;
    let ans=document.getElementById("ans").value;
    if(!title||!ans)return alert("题目和答案不能为空！");
    
    questions.push({
        id:Date.now(),
        pid:nowPaper,
        title:title,
        ans:ans
    });
    
    document.getElementById("title").value="";
    document.getElementById("ans").value="";
    save();
    alert("✅ 出题成功！");
    goPaper(nowPaper);
}

home();
</script>
</body>
</html>
