<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大湾区全科智能刷题系统</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei",sans-serif}
        body{background:linear-gradient(135deg,#f8f9fc 0%,#eef2f8 100%);min-height:100vh;padding:15px}
        .container{max-width:520px;margin:auto}
        .card{background:#fff;border-radius:20px;padding:24px;margin:12px 0;box-shadow:0 8px 24px rgba(0,30,80,0.06)}
        .title{font-size:22px;font-weight:700;color:#2c3e50;text-align:center;margin-bottom:20px}
        .btn{width:100%;padding:15px;border:none;border-radius:14px;font-size:16px;margin:8px 0;background:#4361ee;color:#fff;cursor:pointer}
        .btn-success{background:#06b96f}
        .btn-danger{background:#ef4444}
        .btn-light{background:#f1f5f9;color:#4361ee}
        .input{width:100%;padding:14px 16px;border:1px solid #e2e8f0;border-radius:14px;margin:8px 0;font-size:15px}
        .text-center{text-align:center}
        .tip{font-size:12px;color:#9ca3af;margin-top:8px}
        .price-item{padding:12px 16px;background:#f9fafb;border-radius:12px;margin:6px 0}
        .qrcode{width:180px;margin:15px auto;border-radius:14px;display:block}
        .math-bar{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
        .math-btn{padding:8px 10px;background:#e0e7ff;border:none;border-radius:8px;color:#4361ee}
        .tab{display:flex;gap:6px;margin-bottom:12px}
        .tab button{flex:1;padding:11px;border-radius:10px;border:none;background:#f1f5f9}
        .tab button.active{background:#4361ee;color:#fff}
        .hide{display:none}
        .q-item{padding:14px 0;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between;align-items:center}
        .q-btns{display:flex;gap:6px}
        .q-btns button{padding:6px 10px;border-radius:8px;border:none}
        .item-del{background:#fee2e2;color:#ef4444}
        .item-edit{background:#dbeafe;color:#3b82f6}
        label{cursor:pointer;display:block;margin:6px 0;font-size:15px}
    </style>
</head>
<body>
<div class="container" id="app"></div>
<script>
const ADMIN_PASS = "awedsr134793";
const WECHAT_ID = "475589411";
const PAY_QR_URL = "pay.png";
const CODE_CONFIG = { "YZW2026": { days: 99999 } };

let users = JSON.parse(localStorage.getItem("users")) || [];
let papers = JSON.parse(localStorage.getItem("papers")) || [];
let questions = JSON.parse(localStorage.getItem("questions")) || [];
let wrongBooks = JSON.parse(localStorage.getItem("wrongBooks")) || [];
let examHistory = JSON.parse(localStorage.getItem("examHistory")) || [];

let currentUser = null;
let nowPaperId = 0;
let tempImage = "";
let editingQid = null;

const MATH = [
    {n:"×",v:"\\times"},{n:"÷",v:"\\div"},
    {n:"½",v:"\\frac{1}{2}"},{n:"√",v:"\\sqrt{}"},{n:"²",v:"^2"},{n:"π",v:"\\pi"}
];

function insert(id,v){
    document.getElementById(id).value += "$"+v+"$";
}
function mathBar(id){
    let h='<div class="math-bar">';
    MATH.forEach(m=>{h+=`<button class="math-btn" onclick="insert('${id}','${m.v}')">${m.n}</button>`;});
    return h+'</div>';
}
function saveAll(){
    localStorage.setItem("users",JSON.stringify(users));
    localStorage.setItem("papers",JSON.stringify(papers));
    localStorage.setItem("questions",JSON.stringify(questions));
    localStorage.setItem("wrongBooks",JSON.stringify(wrongBooks));
    localStorage.setItem("examHistory",JSON.stringify(examHistory));
}
function getDay(){return Math.floor(Date.now()/86400000);}

// ========== 首页 ==========
function home(){
    app.innerHTML=`
    <div class="card">
        <div class="title">全科智能刷题系统</div>
        <button class="btn" onclick="login()">学生登录</button>
        <button class="btn" onclick="reg()">注册账号</button>
        <button class="btn btn-light" onclick="adminLogin()">教师后台</button>
        <div class="tip">无邀请码请联系管理员开通</div>
    </div>`;
}

// ========== 登录 ==========
function login(){
    app.innerHTML=`
    <div class="card">
        <div class="title">学生登录</div>
        <input class="input" id="u" placeholder="账号">
        <input class="input" id="p" type="password" placeholder="密码">
        <button class="btn" onclick="loginGo()">登录</button>
        <button class="btn btn-light" onclick="home()">返回</button>
    </div>`;
}
function loginGo(){
    let user = users.find(x=>x.username==document.getElementById("u").value && x.password==document.getElementById("p").value);
    if(!user)return alert("账号或密码错误");
    currentUser = user;
    student();
}

// ========== 注册 ==========
function reg(){
    app.innerHTML=`
    <div class="card">
        <div class="title">注册</div>
        <input class="input" id="ru" placeholder="账号">
        <input class="input" id="rp" type="password" placeholder="密码">
        <input class="input" id="rn" placeholder="姓名">
        <input class="input" id="rc" placeholder="邀请码">
        <button class="btn" onclick="regGo()">注册</button>
        <button class="btn btn-light" onclick="pay()">开通会员</button>
    </div>`;
}
function regGo(){
    let u=document.getElementById("ru").value,p=document.getElementById("rp").value,n=document.getElementById("rn").value,c=document.getElementById("rc").value;
    if(!u||!p||!n||!c)return alert("请完整填写");
    if(!CODE_CONFIG[c])return alert("邀请码无效");
    users.push({username:u,password:p,name:n,regDay:getDay(),validDays:CODE_CONFIG[c].days});
    saveAll();alert("注册成功！");login();
}

// ========== 付费 ==========
function pay(){
    app.innerHTML=`
    <div class="card">
        <div class="title">会员开通</div>
        <div class="price-item">✅ 体验会员 —— 9.9 元</div>
        <div class="price-item">✅ 月会员 —— 38 元</div>
        <div class="price-item">✅ 季度会员 —— 68 元</div>
        <div class="price-item">✅ 年度会员 —— 128 元</div>
        <div class="price-item">✅ 永久会员 —— 199 元</div>
        <img src="${PAY_QR_URL}" class="qrcode">
        <div class="text-center">微信：${WECHAT_ID}</div>
        <button class="btn btn-light" onclick="home()">返回</button>
    </div>`;
}

// ========== 学生中心 ==========
function student(){
    app.innerHTML=`
    <div class="card">
        <div class="title">欢迎，${currentUser.name}</div>
        <button class="btn" onclick="examList('math')">数学刷题</button>
        <button class="btn" onclick="examList('chinese')">语文刷题</button>
        <button class="btn" onclick="examList('english')">英语刷题</button>
        <button class="btn btn-light" onclick="showWrong()">错题本</button>
        <button class="btn btn-light" onclick="home()">退出</button>
    </div>`;
}
function examList(sub){
    let list = papers.filter(x=>x.sub==sub);
    let h=`<div class="card"><div class="title">试卷列表</div>`;
    list.forEach(p=>{h+=`<button class="btn" onclick="startExam(${p.id})">${p.title}</button>`;});
    h+=`<button class="btn btn-light" onclick="student()">返回</button></div>`;
    app.innerHTML=h;
}

// ========== 修复：选择题正常勾选 + 提交判分 ==========
function startExam(pid){
    let qs = questions.filter(x=>x.pid==pid);
    let h=`<div class="card"><div class="title">开始答题</div>`;
    
    qs.forEach((q,i)=>{
        h+=`<div style="margin:18px 0"><b>${i+1}.</b> <span class="mj-parse">${q.content}</span></div>`;
        
        // 单选题（修复可勾选）
        if(q.type==1){
            h+=`
            <label><input type="radio" name="q_${i}" value="A"> A. ${q.op[0]}</label>
            <label><input type="radio" name="q_${i}" value="B"> B. ${q.op[1]}</label>
            <label><input type="radio" name="q_${i}" value="C"> C. ${q.op[2]}</label>
            <label><input type="radio" name="q_${i}" value="D"> D. ${q.op[3]}</label>
            `;
        }

        // 判断题
        if(q.type==3){
            h+=`
            <label><input type="radio" name="q_${i}" value="对"> 对</label>
            <label><input type="radio" name="q_${i}" value="错"> 错</label>
            `;
        }

        // 填空题
        if(q.type==4){
            h+=`<input class="input" id="q_${i}" placeholder="输入答案">`;
        }
    });

    h+=`<button class="btn btn-success" onclick="submitExam(${pid})">提交试卷</button></div>`;
    app.innerHTML=h;
    MathJax.typeset();
}

function submitExam(pid){
    let qs = questions.filter(x=>x.pid==pid);
    let score = 0;
    let wrongList = [];

    qs.forEach((q,i)=>{
        let val = "";
        if(q.type==1 || q.type==3){
            let selected = document.querySelector(`input[name="q_${i}"]:checked`);
            val = selected ? selected.value : "";
        }
        if(q.type==4){
            val = document.getElementById(`q_${i}`).value.trim();
        }
        if(val == q.answer) score++;
        else wrongList.push(q);
    });

    wrongBooks.push(...wrongList);
    examHistory.push({score:score,total:qs.length,time:new Date().toLocaleString()});
    saveAll();
    alert(`考试完成！\n得分：${score}/${qs.length}`);
    student();
}

function showWrong(){
    let list = wrongBooks.filter(x=>x.pid==nowPaperId);
    let h=`<div class="card"><div class="title">错题本</div>`;
    list.forEach(q=>{h+=`<div style="padding:10px 0;border-bottom:1px solid #eee"><span class="mj-parse">${q.content}</span></div>`;});
    h+=`<button class="btn btn-light" onclick="student()">返回</button></div>`;
    app.innerHTML=h;MathJax.typeset();
}

// ========== 教师后台 ==========
function adminLogin(){
    app.innerHTML=`
    <div class="card">
        <div class="title">教师登录</div>
        <input class="input" id="pwd" type="password" placeholder="密码">
        <button class="btn" onclick="if(document.getElementById('pwd').value==ADMIN_PASS)admin()">登录</button>
    </div>`;
}
function admin(){
    app.innerHTML=`
    <div class="card">
        <div class="title">管理中心</div>
        <button class="btn" onclick="addPaper()">新建试卷</button>
        <button class="btn" onclick="paperList()">管理题目</button>
        <button class="btn" onclick="batchImport()">批量导入</button>
        <button class="btn" onclick="picQuestion()">图片题目</button>
        <button class="btn" onclick="userList()">用户管理</button>
        <button class="btn" onclick="createInvite()">生成邀请码</button>
        <button class="btn btn-light" onclick="home()">退出</button>
    </div>`;
}

// ========== 试卷 ==========
function addPaper(){
    let title=prompt("试卷名称");
    if(!title)return;
    papers.push({id:Date.now(),title:title,sub:"math"});
    saveAll();paperList();
}
function paperList(){
    let h=`<div class="card"><div class="title">试卷</div>`;
    papers.forEach(p=>{h+=`<button class="btn" onclick="goPaper(${p.id})">${p.title}</button>`;});
    h+=`<button class="btn btn-light" onclick="admin()">返回</button></div>`;
    app.innerHTML=h;
}

// ========== 出题（增删改） ==========
function goPaper(pid){
    nowPaperId=pid;editingQid=null;
    let qs=questions.filter(x=>x.pid==pid);
    let h=`
    <div class="card">
        <div class="title">出题中心</div>
        <div class="tab">
            <button onclick="tab(1)" id="t1" class="active">单选</button>
            <button onclick="tab(3)" id="t3">判断</button>
            <button onclick="tab(4)" id="t4">填空</button>
        </div>

        <div id="m1">
            ${mathBar("c1")}
            <textarea class="input" id="c1" placeholder="题目"></textarea>
            <input class="input" id="a1" placeholder="A">
            <input class="input" id="b1" placeholder="B">
            <input class="input" id="c1i" placeholder="C">
            <input class="input" id="d1" placeholder="D">
            <input class="input" id="ans1" placeholder="答案(A/B/C/D)">
        </div>
        <div id="m3" class="hide">
            ${mathBar("c3")}
            <textarea class="input" id="c3" placeholder="题目"></textarea>
            <input class="input" id="ans3" placeholder="对/错">
        </div>
        <div id="m4" class="hide">
            ${mathBar("c4")}
            <textarea class="input" id="c4" placeholder="题目"></textarea>
            <input class="input" id="ans4" placeholder="答案">
        </div>

        <button class="btn btn-success" onclick="saveQ()">保存题目</button>
        <div style="margin:20px 0"><b>已有题目：</b></div>`;

    qs.forEach(q=>{
        h+=`
        <div class="q-item">
            <span class="mj-parse">${q.content}</span>
            <div class="q-btns">
                <button class="item-edit" onclick="editQ(${q.id})">修改</button>
                <button class="item-del" onclick="delQ(${q.id})">删除</button>
            </div>
        </div>`;
    });

    h+=`<button class="btn btn-light" onclick="paperList()">返回</button></div>`;
    app.innerHTML=h;MathJax.typeset();
}

function tab(n){
    document.querySelectorAll("#m1,#m3,#m4").forEach(x=>x.classList.add("hide"));
    document.querySelectorAll(".tab button").forEach(x=>x.classList.remove("active"));
    document.getElementById("m"+n).classList.remove("hide");
    document.getElementById("t"+n).classList.add("active");
}

function saveQ(){
    let t=document.querySelector(".tab button.active").innerText;
    let content,op=[],ans,type=1;
    if(t.includes("单")){
        type=1; content=document.getElementById("c1").value;
        op=[document.getElementById("a1").value,document.getElementById("b1").value,document.getElementById("c1i").value,document.getElementById("d1").value];
        ans=document.getElementById("ans1").value;
    }
    if(t.includes("判")){type=3; content=document.getElementById("c3").value; ans=document.getElementById("ans3").value;}
    if(t.includes("填")){type=4; content=document.getElementById("c4").value; ans=document.getElementById("ans4").value;}
    if(!content||!ans)return alert("题目和答案不能为空");
    if(editingQid)questions=questions.filter(x=>x.id!=editingQid);
    questions.push({id:Date.now(),pid:nowPaperId,type:type,content:content,op:op,answer:ans});
    saveAll();goPaper(nowPaperId);
}
function editQ(id){editingQid=id;let q=questions.find(x=>x.id==id);
    if(q.type==1){tab(1);document.getElementById("c1").value=q.content;document.getElementById("a1").value=q.op[0];document.getElementById("b1").value=q.op[1];document.getElementById("c1i").value=q.op[2];document.getElementById("d1").value=q.op[3];document.getElementById("ans1").value=q.answer;}
    if(q.type==3){tab(3);document.getElementById("c3").value=q.content;document.getElementById("ans3").value=q.answer;}
    if(q.type==4){tab(4);document.getElementById("c4").value=q.content;document.getElementById("ans4").value=q.answer;}
}
function delQ(id){if(!confirm("确定删除？"))return;questions=questions.filter(x=>x.id!=id);saveAll();goPaper(nowPaperId);}

// ========== 完整功能 ==========
function batchImport(){app.innerHTML=`<div class="card"><div class="title">批量导入</div><div class="tip">格式：题目|A|B|C|D|答案</div><textarea class="input" rows="8" id="batch"></textarea><button class="btn" onclick="batchGo()">导入</button></div>`;}
function batchGo(){document.getElementById("batch").value.split("\n").forEach(line=>{let a=line.split("|");questions.push({id:Date.now(),pid:nowPaperId,type:1,content:a[0],op:[a[1],a[2],a[3],a[4]],answer:a[5]});});saveAll();alert("导入成功");admin();}
function picQuestion(){tempImage="";app.innerHTML=`<div class="card"><div class="title">图片题目</div><input type="file" accept="image/*" onchange="preImg(event)"><button class="btn" onclick="editPic()">下一步</button></div>`;}
function preImg(e){let f=new FileReader();f.onload=e=>tempImage=e.target.result;f.readAsDataURL(e.target.files[0]);}
function editPic(){app.innerHTML=`<div class="card"><div class="title">编辑</div>${mathBar("pc")}<textarea class="input" id="pc"></textarea><input class="input" id="pa" placeholder="答案"><button class="btn" onclick="savePic()">保存</button></div>`;}
function savePic(){questions.push({id:Date.now(),pid:nowPaperId,type:1,content:document.getElementById("pc").value,img:tempImage,answer:document.getElementById("pa").value});saveAll();admin();}
function userList(){let h=`<div class="card"><div class="title">用户列表</div>`;users.forEach(u=>{h+=`<div style="padding:10px;border-bottom:1px solid #eee">${u.username}（${u.name}）</div>`;});h+=`<button class="btn btn-light" onclick="admin()">返回</button></div>`;app.innerHTML=h;}
function createInvite(){let code="VIP"+Math.random().toString().slice(-6);CODE_CONFIG[code]={days:365};alert("邀请码："+code);admin();}

home();
</script>
</body>
</html>
