<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大湾区全科 - 中小学智能刷题平台</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
        body{
            background:linear-gradient(135deg,#e6f7ff 0%,#f0f9ff 100%);
            min-height:100vh;
            padding:15px;
            position:relative;
        }
        body::after{
            content:"大湾区全科";
            position:fixed;
            top:50%;left:50%;
            transform:translate(-50%,-50%);
            font-size:48px;
            font-weight:bold;
            color:rgba(50,130,240,0.07);
            z-index:1;
            pointer-events:none;
            white-space:nowrap;
        }
        .container{
            max-width:560px;
            margin:auto;
            position:relative;
            z-index:2;
        }
        .card{
            background:#fff;
            border-radius:24px;
            padding:26px;
            margin:14px 0;
            box-shadow:0 12px 32px rgba(60,120,240,0.08);
            border:1px solid rgba(255,255,255,0.7);
        }
        .title{
            font-size:24px;
            font-weight:700;
            color:#1d5bc0;
            text-align:center;
            margin-bottom:22px;
        }
        .sub-title{
            font-size:14px;
            color:#666;
            text-align:center;
            margin-bottom:20px;
        }
        .btn{
            width:100%;
            padding:17px;
            border:none;
            border-radius:18px;
            font-size:16px;
            font-weight:500;
            margin:10px 0;
            background:#3282f0;
            color:#fff;
            cursor:pointer;
            transition:0.2s;
        }
        .btn:hover{opacity:0.93}
        .btn-success{background:#22c580}
        .btn-warning{background:#f59e0b}
        .btn-danger{background:#f43f5e}
        .btn-light{background:#eff6ff;color:#3282f0}
        .input{
            width:100%;
            padding:16px 18px;
            border:1px solid #d1e5ff;
            border-radius:18px;
            margin:10px 0;
            font-size:15px;
            background:#fafbff;
            transition:0.2s;
        }
        .input:focus{
            outline:none;
            border-color:#3282f0;
            background:#fff;
        }
        .tag{
            display:inline-block;
            padding:5px 10px;
            border-radius:12px;
            font-size:12px;
            font-weight:bold;
            color:#fff;
            margin-right:6px;
        }
        .tag-test{background:#94a3b8}
        .tag-month{background:#3282f0}
        .tag-season{background:#8b5cf6}
        .tag-year{background:#22c580}
        .tag-vip{background:#f59e0b}
        .subject-grid{
            display:grid;
            grid-template-columns:1fr 1fr 1fr;
            gap:12px;
            margin:20px 0;
        }
        .subject-item{
            background:#eff6ff;
            border-radius:18px;
            padding:20px 10px;
            text-align:center;
            cursor:pointer;
        }
        .stat-box{
            background:#f7fbff;
            border-radius:16px;
            padding:18px;
            margin:12px 0;
            text-align:center;
        }
        .stat-row{
            display:flex;
            justify-content:space-between;
            margin:10px 0;
        }
        .user-item{
            background:#f8fafc;
            border-radius:16px;
            padding:18px;
            margin-bottom:10px;
        }
        .q-item{
            padding:18px 0;
            border-bottom:1px solid #f0f7ff;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }
        .q-btns{display:flex;gap:10px}
        .q-btns button{
            padding:8px 12px;
            border-radius:10px;
            border:none;
            font-size:12px;
        }
        .item-edit{background:#dbeafe;color:#3282f0}
        .item-del{background:#fee2e2;color:#f43f5e}
        label{
            display:block;margin:10px 0;
            font-size:15px;color:#333;
            cursor:pointer;
        }
        .math-bar{
            display:flex;flex-wrap:wrap;gap:8px;
            margin:12px 0;
        }
        .math-btn{
            padding:10px 12px;
            background:#e0eaff;
            border:none;
            border-radius:10px;
            color:#3282f0;
        }
        .tab{
            display:flex;gap:10px;
            margin-bottom:16px;
        }
        .tab button{
            flex:1;
            padding:14px;
            border-radius:14px;
            border:none;
            background:#f0f7ff;
            font-weight:500;
        }
        .tab button.active{
            background:#3282f0;
            color:#fff;
        }
        .hide{display:none}
    </style>
</head>
<body>
<div class="container" id="app"></div>
<script>
const ADMIN_PASS = "aweds123";
const WECHAT = "475589411";
const PAY_QR = "wx.png";

const CODE_CONFIG = {
    "tiyan2026":{name:"体验会员",days:1},
    "yue2026":{name:"月会员",days:30},
    "ji2026":{name:"季会员",days:90},
    "nian2026":{name:"年会员",days:365},
    "VIP999":{name:"永久会员",days:99999}
};

let users = JSON.parse(localStorage.getItem("users")) || [];
let papers = JSON.parse(localStorage.getItem("papers")) || [];
let questions = JSON.parse(localStorage.getItem("questions")) || [];
let wrongBooks = JSON.parse(localStorage.getItem("wrongBooks")) || [];
let examHistory = JSON.parse(localStorage.getItem("examHistory")) || [];

let currentUser = null;
let nowPaperId = 0;
let tempImg = "";
let editQid = null;

const MATH = [
    {n:"×",v:"\\times"},{n:"÷",v:"\\div"},
    {n:"½",v:"\\frac{1}{2}"},{n:"√",v:"\\sqrt{}"},{n:"²",v:"^2"},{n:"π",v:"\\pi"}
];

function insert(id,v){document.getElementById(id).value += "$"+v+"$";}
function mathBar(id){
    let h='<div class="math-bar">';
    MATH.forEach(m=>{h+=`<button class="math-btn" onclick="insert('${id}','${m.v}')">${m.n}</button>`;});
    return h+'</div>';
}
function save(){
    localStorage.setItem("users",JSON.stringify(users));
    localStorage.setItem("papers",JSON.stringify(papers));
    localStorage.setItem("questions",JSON.stringify(questions));
    localStorage.setItem("wrongBooks",JSON.stringify(wrongBooks));
    localStorage.setItem("examHistory",JSON.stringify(examHistory));
}
function day(){return Math.floor(Date.now()/86400000);}

// ========== 首页 ==========
function home(){
    app.innerHTML=`
    <div class="card">
        <div class="title">大湾区全科</div>
        <div class="sub-title">中小学智能刷题学习平台</div>
        <button class="btn" onclick="login()">学生登录</button>
        <button class="btn" onclick="reg()">注册账号</button>
        <button class="btn btn-light" onclick="adminLogin()">教师后台</button>
    </div>`;
}

// ========== 登录 ==========
function login(){
    app.innerHTML=`
    <div class="card">
        <div class="title">学生登录</div>
        <input class="input" id="u" placeholder="账号">
        <input class="input" id="p" type="password" placeholder="密码">
        <button class="btn" onclick="loginGo()">登录</button>
        <button class="btn btn-light" onclick="home()">返回</button>
    </div>`;
}
function loginGo(){
    let u = document.getElementById("u").value;
    let p = document.getElementById("p").value;
    let user = users.find(x=>x.username==u&&x.password==p);
    if(!user)return alert("账号或密码错误");
    let expire = user.regDay + user.validDays;
    if(day()>expire)return alert("会员已到期");
    currentUser = user;
    student();
}

// ========== 注册 ==========
function reg(){
    app.innerHTML=`
    <div class="card">
        <div class="title">注册</div>
        <input class="input" id="ru" placeholder="账号">
        <input class="input" id="rp" placeholder="密码">
        <input class="input" id="rn" placeholder="姓名">
        <input class="input" id="rc" placeholder="邀请码">
        <button class="btn" onclick="regGo()">注册</button>
        <button class="btn btn-light" onclick="home()">返回</button>
    </div>`;
}
function regGo(){
    let u=document.getElementById("ru").value,p=document.getElementById("rp").value;
    let n=document.getElementById("rn").value,c=document.getElementById("rc").value;
    if(!u||!p||!n||!c)return alert("请完整填写");
    if(!CODE_CONFIG[c])return alert("邀请码无效");
    users.push({
        username:u,password:p,name:n,
        regDay:day(),validDays:CODE_CONFIG[c].days,
        vipType:CODE_CONFIG[c].name
    });
    save();
    alert("注册成功！");
    login();
}

// ========== 学生中心（V2.0全新） ==========
function student(){
    let expire = currentUser.regDay + currentUser.validDays;
    let left = expire - day();
    app.innerHTML=`
    <div class="card">
        <div class="title">你好，${currentUser.name}</div>
        <div style="text-align:center;margin-bottom:20px">
            <span class="tag ${currentUser.vipType.includes("体验")?"tag-test":
              currentUser.vipType.includes("月")?"tag-month":
              currentUser.vipType.includes("季")?"tag-season":
              currentUser.vipType.includes("年")?"tag-year":"tag-vip"}">
                ${currentUser.vipType}
            </span>
            <div style="font-size:13px;color:#666;margin-top:8px">剩余 ${left} 天</div>
        </div>
        <div class="subject-grid">
            <div class="subject-item" onclick="examList('math')">数学</div>
            <div class="subject-item" onclick="examList('chinese')">语文</div>
            <div class="subject-item" onclick="examList('english')">英语</div>
        </div>
        <button class="btn btn-success" onclick="myData()">📊 学习数据</button>
        <button class="btn btn-warning" onclick="showWrong()">📕 错题本</button>
        <button class="btn btn-light" onclick="home()">退出登录</button>
    </div>`;
}

// ========== 学习数据（V2.0新增） ==========
function myData(){
    let myRecord = examHistory.filter(x=>x.user==currentUser.username);
    let total = myRecord.length;
    let scoreSum = 0;
    myRecord.forEach(x=>{scoreSum+=x.score});
    let avg = total>0 ? (scoreSum/total).toFixed(1) : 0;
    let wrongNum = wrongBooks.filter(x=>x.user==currentUser.username).length;

    app.innerHTML=`
    <div class="card">
        <div class="title">学习数据</div>
        <div class="stat-box">
            <div class="stat-row"><span>做题次数</span><span>${total}</span></div>
            <div class="stat-row"><span>平均得分</span><span>${avg} 分</span></div>
            <div class="stat-row"><span>错题数量</span><span>${wrongNum} 题</span></div>
        </div>
        <button class="btn btn-light" onclick="student()">返回</button>
    </div>`;
}

// ========== 题库列表 ==========
function examList(sub){
    let list = papers.filter(x=>x.sub==sub);
    let h=`<div class="card"><div class="title">${sub=="math"?"数学":sub=="chinese"?"语文":"英语"}题库</div>`;
    list.forEach(p=>{h+=`<button class="btn" onclick="startExam(${p.id})">${p.title}</button>`;});
    h+=`<button class="btn btn-light" onclick="student()">返回</button></div>`;
    app.innerHTML=h;
}

// ========== 开始答题 ==========
function startExam(pid){
    nowPaperId = pid;
    let qs = questions.filter(x=>x.pid==pid);
    let h=`<div class="card"><div class="title">开始答题</div>`;
    qs.forEach((q,i)=>{
        h+=`<div style="margin:20px 0"><b>${i+1}.</b> <span class="mj-parse">${q.content}</span></div>`;
        if(q.type==1){
            h+=`<label><input type="radio" name="q${i}" value="A"> A. ${q.op[0]}</label>
            <label><input type="radio" name="q${i}" value="B"> B. ${q.op[1]}</label>
            <label><input type="radio" name="q${i}" value="C"> C. ${q.op[2]}</label>
            <label><input type="radio" name="q${i}" value="D"> D. ${q.op[3]}</label>`;
        }
        if(q.type==3){
            h+=`<label><input type="radio" name="q${i}" value="对"> 对</label>
            <label><input type="radio" name="q${i}" value="错"> 错</label>`;
        }
        if(q.type==4){
            h+=`<input class="input" id="q${i}" placeholder="请输入答案">`;
        }
    });
    h+=`<button class="btn btn-success" onclick="submitExam(${pid})">提交试卷</button></div>`;
    app.innerHTML=h;MathJax.typeset();
}

// ========== 交卷评分 ==========
function submitExam(pid){
    let qs = questions.filter(x=>x.pid==pid);
    let score=0;let wrong=[];
    qs.forEach((q,i)=>{
        let v="";
        if(q.type==1||q.type==3){
            let r=document.querySelector(`input[name="q${i}"]:checked`);
            v=r?r.value:"";
        }else v=document.getElementById(`q${i}`).value.trim();
        if(v==q.answer)score++;
        else wrong.push({...q,user:currentUser.username});
    });
    examHistory.push({
        user:currentUser.username,
        score:score,total:qs.length,
        time:new Date().toLocaleString()
    });
    wrongBooks.push(...wrong);
    save();
    alert(`完成！得分：${score}/${qs.length}`);
    student();
}

// ========== 错题本 ==========
function showWrong(){
    let list = wrongBooks.filter(x=>x.user==currentUser.username);
    let h=`<div class="card"><div class="title">我的错题本</div>`;
    list.forEach(q=>{h+=`<div style="padding:12px 0;border-bottom:1px solid #eee"><span class="mj-parse">${q.content}</span></div>`;});
    h+=`<button class="btn btn-light" onclick="student()">返回</button></div>`;
    app.innerHTML=h;MathJax.typeset();
}

// ========== 教师后台 ==========
function adminLogin(){
    app.innerHTML=`
    <div class="card">
        <div class="title">教师后台</div>
        <input class="input" id="pwd" type="password" placeholder="管理员密码">
        <button class="btn" onclick="if(document.getElementById('pwd').value==ADMIN_PASS)admin()">登录</button>
    </div>`;
}
function admin(){
    app.innerHTML=`
    <div class="card">
        <div class="title">管理中心</div>
        <button class="btn" onclick="addPaper()">新建试卷</button>
        <button class="btn" onclick="paperList()">管理题库</button>
        <button class="btn" onclick="userList()">用户管理</button>
        <button class="btn" onclick="showCodes()">邀请码</button>
        <button class="btn btn-light" onclick="home()">退出</button>
    </div>`;
}

// ========== 试卷管理 ==========
function addPaper(){
    let title=prompt("试卷名称");
    if(!title)return;
    let sub=prompt("科目：math/chinese/english");
    papers.push({id:Date.now(),title:title,sub:sub});
    save();paperList();
}
function paperList(){
    let h=`<div class="card"><div class="title">试卷列表</div>`;
    papers.forEach(p=>{h+=`<button class="btn" onclick="goPaper(${p.id})">${p.title}</button>`;});
    h+=`<button class="btn btn-light" onclick="admin()">返回</button></div>`;
    app.innerHTML=h;
}

// ========== 出题 ==========
function goPaper(pid){
    nowPaperId=pid;editQid=null;
    let qs=questions.filter(x=>x.pid==pid);
    let h=`
    <div class="card">
        <div class="title">出题中心</div>
        <div class="tab">
            <button onclick="tab(1)" id="t1" class="active">单选</button>
            <button onclick="tab(3)" id="t3">判断</button>
            <button onclick="tab(4)" id="t4">填空</button>
        </div>
        <div id="m1">
            ${mathBar("c1")}
            <textarea class="input" id="c1" placeholder="题目"></textarea>
            <input class="input" id="a1" placeholder="A">
            <input class="input" id="b1" placeholder="B">
            <input class="input" id="c1i" placeholder="C">
            <input class="input" id="d1" placeholder="D">
            <input class="input" id="ans1" placeholder="答案">
        </div>
        <div id="m3" class="hide">
            ${mathBar("c3")}
            <textarea class="input" id="c3" placeholder="题目"></textarea>
            <input class="input" id="ans3" placeholder="对/错">
        </div>
        <div id="m4" class="hide">
            ${mathBar("c4")}
            <textarea class="input" id="c4" placeholder="题目"></textarea>
            <input class="input" id="ans4" placeholder="答案">
        </div>
        <button class="btn btn-success" onclick="saveQ()">保存题目</button>
        <div style="margin:20px 0;font-weight:bold">题目列表</div>`;
    qs.forEach(q=>{
        h+=`
        <div class="q-item">
            <span class="mj-parse">${q.content}</span>
            <div class="q-btns">
                <button class="item-edit" onclick="editQ(${q.id})">修改</button>
                <button class="item-del" onclick="delQ(${q.id})">删除</button>
            </div>
        </div>`;
    });
    h+=`<button class="btn btn-light" onclick="paperList()">返回</button></div>`;
    app.innerHTML=h;MathJax.typeset();
}
function tab(n){
    document.querySelectorAll("#m1,#m3,#m4").forEach(x=>x.classList.add("hide"));
    document.querySelectorAll(".tab button").forEach(x=>x.classList.remove("active"));
    document.getElementById("m"+n).classList.remove("hide");
    document.getElementById("t"+n).classList.add("active");
}
function saveQ(){
    let t=document.querySelector(".tab button.active").innerText;
    let content,op=[],ans,type=1;
    if(t.includes("单")){
        type=1; content=document.getElementById("c1").value;
        op=[document.getElementById("a1").value,document.getElementById("b1").value,document.getElementById("c1i").value,document.getElementById("d1").value];
        ans=document.getElementById("ans1").value;
    }
    if(t.includes("判")){type=3; content=document.getElementById("c3").value; ans=document.getElementById("ans3").value;}
    if(t.includes("填")){type=4; content=document.getElementById("c4").value; ans=document.getElementById("ans4").value;}
    if(!content||!ans)return alert("不能为空");
    if(editQid)questions=questions.filter(x=>x.id!=editQid);
    questions.push({id:Date.now(),pid:nowPaperId,type:type,content:content,op:op,answer:ans});
    save();goPaper(nowPaperId);
}
function editQ(id){
    editQid=id;let q=questions.find(x=>x.id==id);
    if(q.type==1){tab(1);document.getElementById("c1").value=q.content;
    document.getElementById("a1").value=q.op[0];document.getElementById("b1").value=q.op[1];
    document.getElementById("c1i").value=q.op[2];document.getElementById("d1").value=q.op[3];
    document.getElementById("ans1").value=q.answer;}
    if(q.type==3){tab(3);document.getElementById("c3").value=q.content;document.getElementById("ans3").value=q.answer;}
    if(q.type==4){tab(4);document.getElementById("c4").value=q.content;document.getElementById("ans4").value=q.answer;}
}
function delQ(id){if(!confirm("确定删除？"))return;questions=questions.filter(x=>x.id!=id);save();goPaper(nowPaperId);}

// ========== 用户管理（V2.0） ==========
function userList(){
    let h=`<div class="card"><div class="title">用户管理</div>`;
    users.forEach((u,i)=>{
        let l = u.regDay+u.validDays-day();
        h+=`
        <div class="user-item">
            ${u.name} @${u.username}<br>
            ${u.vipType} | 剩余 ${l} 天<br>
            <button class="btn-danger" style="width:auto;padding:6px 10px;margin-top:8px" onclick="delUser(${i})">删除</button>
        </div>`;
    });
    h+=`<button class="btn btn-light" onclick="admin()">返回</button></div>`;
    app.innerHTML=h;
}
function delUser(i){if(!confirm("确定删除？"))return;users.splice(i,1);save();userList();}

// ========== 邀请码 ==========
function showCodes(){
    alert(`邀请码列表：
体验：tiyan2026
月卡：yue2026
季卡：ji2026
年卡：nian2026
永久：VIP999`);
}

home();
</script>
</body>
</html>
