<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全科刷题系统</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        *{box-sizing:border-box}
        body{background:#f5f7fa;margin:0;padding:15px;font-family:微软雅黑}
        .container{max-width:500px;margin:0 auto}
        .card{background:white;border-radius:16px;padding:25px;margin:15px 0;box-shadow:0 2px 10px #00000010}
        .title{text-align:center;font-size:22px;font-weight:bold;margin-bottom:20px;color:#2c52ed}
        input,textarea,select{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px}
        button{width:100%;padding:13px;background:#2c52ed;color:white;border:none;border-radius:8px;margin-top:8px}
        .btn-outline{background:white;color:#2c52ed;border:1px solid #2c52ed}
        .tip{font-size:12px;color:#666}
        .tag{display:inline-block;padding:3px 8px;border-radius:4px;color:#fff}
        .tag-sx{background:#2c52ed}
        .item-box{padding:12px;border-bottom:1px solid #eee;margin:5px 0}
        .q-img{max-width:100%;max-height:220px;border-radius:8px;margin:8px 0}
    </style>
</head>
<body>
    <div class="container" id="app"></div>
    <script>
        const ADMIN_PASS = "123456";
        const SUBJECT_LIST = [{key:"math",name:"数学",cls:"tag-sx"}];
        const QUESTION_TYPES = {1:"单选题",2:"多选题",3:"判断题",4:"填空题"};

        let users = [];
        let papers = JSON.parse(localStorage.getItem("papers")) || [];
        let questions = JSON.parse(localStorage.getItem("questions")) || [];
        let currentUser = null;
        let nowPaperId = 0;
        let tempImage = "";

        // ===================== 【核心：导出 + 导入 同步数据】 =====================
        function exportData() {
            let data = { papers, questions };
            let blob = new Blob([JSON.stringify(data)], {type:"application/json"});
            let url = URL.createObjectURL(blob);
            let a = document.createElement("a");
            a.href = url;
            a.download = "题库数据.json";
            a.click();
            alert("✅ 导出成功！发给微信即可同步");
        }

        function importData(e) {
            let file = e.target.files[0];
            let reader = new FileReader();
            reader.onload = function(ev) {
                let data = JSON.parse(ev.target.result);
                papers = data.papers || [];
                questions = data.questions || [];
                localStorage.setItem("papers", JSON.stringify(papers));
                localStorage.setItem("questions", JSON.stringify(questions));
                alert("✅ 导入同步成功！");
                renderAdminMain();
            };
            reader.readAsText(file);
        }

        function saveAll() {
            localStorage.setItem("papers", JSON.stringify(papers));
            localStorage.setItem("questions", JSON.stringify(questions));
        }

        // ===================== 页面 =====================
        function renderHome() {
            document.getElementById("app").innerHTML = `
            <div class="card">
                <div class="title">刷题系统</div>
                <button onclick="renderAdminLogin()">教师后台</button>
            </div>`;
        }

        function renderAdminLogin() {
            document.getElementById("app").innerHTML = `
            <div class="card">
                <div class="title">教师登录</div>
                <input id="pwd" type="password" placeholder="密码：123456">
                <button onclick="checkAdmin()">登录</button>
            </div>`;
        }

        function checkAdmin() {
            if (document.getElementById("pwd").value === ADMIN_PASS) {
                renderAdminMain();
            }
        }

        function renderAdminMain() {
            document.getElementById("app").innerHTML = `
            <div class="card">
                <div class="title">管理后台</div>
                <button onclick="adminCreatePaper()">新建试卷</button>
                <button class="mt10" onclick="adminPaperList()">试卷管理</button>
                <button style="background:#e6551c" onclick="adminOcrPage()">📷 图片识别试题</button>
                
                <button style="background:#009688" onclick="exportData()">💾 一键导出数据</button>
                <label class="btn-outline"><input type="file" hidden onchange="importData(event)"> 📂 一键导入数据</label>
                
                <button class="mt10" onclick="renderHome()">返回</button>
            </div>`;
        }

        function adminCreatePaper() {
            let name = prompt("试卷名");
            if (name) {
                papers.push({ id: Date.now(), title: name, subject: "math" });
                saveAll();
                adminPaperList();
            }
        }

        function adminPaperList() {
            let html = `<div class="card"><div class="title">试卷</div>`;
            papers.forEach(p => {
                html += `<div class="item-box">
                    ${p.title}
                    <button onclick="adminManagePaper(${p.id})">管理题目</button>
                </div>`;
            });
            html += `<button onclick="renderAdminMain()">返回</button></div>`;
            document.getElementById("app").innerHTML = html;
        }

        function adminManagePaper(pid) {
            nowPaperId = pid;
            let list = questions.filter(q => q.paper_id == pid);
            let html = `<div class="card"><div class="title">题目</div>`;
            list.forEach(q => {
                html += `<div class="item-box">
                    ${q.content}
                    ${q.image ? `<img src="${q.image}" class="q-img">` : ""}
                    答案：${q.answer}
                </div>`;
            });
            html += `<button onclick="adminAddQuestion()">手动添加</button>
                     <button style="background:#e6551c" onclick="adminOcrToPaper(${pid})">图片识别添加</button>
                     <button onclick="adminPaperList()">返回</button></div>`;
            document.getElementById("app").innerHTML = html;
        }

        function adminAddQuestion() {
            let content = prompt("题目");
            let ans = prompt("答案");
            if (content && ans) {
                questions.push({
                    id: Date.now(), paper_id: nowPaperId, content, answer: ans, image: tempImage || ""
                });
                tempImage = "";
                saveAll();
                adminManagePaper(nowPaperId);
            }
        }

        // 图片识别
        function adminOcrPage() {
            document.getElementById("app").innerHTML = `
            <div class="card">
                <div class="title">图片识别</div>
                <input type="file" accept="image/*" onchange="previewImage(event)">
                <img id="p" style="max-width:100%">
                <button onclick="doOCR()">识别</button>
            </div>`;
        }

        function previewImage(e) {
            let reader = new FileReader();
            reader.onload = ev => {
                tempImage = ev.target.result;
                document.getElementById("p").src = tempImage;
            };
            reader.readAsDataURL(e.target.files[0]);
        }

        async function doOCR() {
            alert("识别中…");
            const { data: { text } } = await Tesseract.recognize(tempImage, 'chi_sim');
            document.getElementById("app").innerHTML = `
            <div class="card">
                <textarea id="c" style="width:100%;height:100px">${text}</textarea>
                <input id="a" placeholder="答案">
                <button onclick="saveOcr()">保存题目</button>
            </div>`;
        }

        function saveOcr() {
            let c = document.getElementById("c").value;
            let a = document.getElementById("a").value;
            questions.push({ id: Date.now(), paper_id: nowPaperId, content: c, answer: a, image: tempImage });
            tempImage = "";
            saveAll();
            renderAdminMain();
        }

        renderHome();
    </script>
</body>
</html>
