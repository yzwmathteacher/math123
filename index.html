<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大湾区全科智能刷题系统</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family: "Microsoft YaHei",sans-serif}
        body{background:linear-gradient(135deg,#f7f8fa 0%,#eef2f5 100%);min-height:100vh;padding:15px}
        .container{max-width:500px;margin:auto}
        .card{background:#fff;border-radius:20px;padding:25px;margin:12px 0;box-shadow:0 10px 30px rgba(0,20,60,0.08)}
        .title{font-size:22px;font-weight:bold;color:#2d3748;text-align:center;margin-bottom:20px}
        .btn{width:100%;padding:15px;border:none;border-radius:14px;font-size:16px;margin:8px 0;background:#4361ee;color:#fff;cursor:pointer}
        .btn-success{background:#10b981}
        .btn-light{background:#f1f5f9;color:#4361ee}
        .input{width:100%;padding:14px 16px;border:1px solid #e2e8f0;border-radius:14px;margin:8px 0;font-size:15px;background:#fafbfc}
        .text-center{text-align:center}
        .red{color:#ef4444}
        .tip{font-size:12px;color:#9ca3af;text-align:center;margin-top:10px}
        .price-item{padding:12px 16px;background:#f9fafb;border-radius:12px;margin:6px 0;font-size:15px}
        .qrcode{width:180px;margin:15px auto;border-radius:12px;display:block}
        .math-tool{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
        .math-btn{padding:8px 10px;background:#e0e7ff;border:none;border-radius:8px;color:#4361ee}
        .tab{display:flex;gap:5px;margin-bottom:10px}
        .tab button{flex:1;padding:10px;border-radius:10px;border:none;background:#f1f5f9}
        .tab button.active{background:#4361ee;color:#fff}
        .hide{display:none}
        .import-box{border:2px dashed #cbd5e1;padding:25px;border-radius:16px;text-align:center;margin:10px 0}
    </style>
</head>
<body>
<div class="container" id="app"></div>
<script>
const ADMIN_PASS = "awedsr134793";
const PAY_QR_URL = "wx.png";
const WECHAT_ID = "475589411";

let users = JSON.parse(localStorage.getItem("users"))||[];
let papers = JSON.parse(localStorage.getItem("papers"))||[];
let questions = JSON.parse(localStorage.getItem("questions"))||[];
let currentUser=null, nowPaperId=0;

const MATH = [
    {n:"×",v:"\\times"},{n:"÷",v:"\\div"},{n:"=",v:"="},{n:"≠",v:"\\neq"},
    {n:"½",v:"\\frac{1}{2}"},{n:"⅓",v:"\\frac{1}{3}"},{n:"分数",v:"\\frac{}{}"},
    {n:"平方",v:"^2"},{n:"根号",v:"\\sqrt{}"},{n:"π",v:"\\pi"}
];

function insert(id,v){
    let t=document.getElementById(id);
    t.value += v;
    t.focus();
}

function mathBar(id){
    let h='<div class="math-tool">';
    MATH.forEach(m=>{h+=`<button class="math-btn" onclick="insert('${id}','${m.v}')">${m.n}</button>`});
    return h+'</div>';
}

function save(){
    localStorage.setItem("users",JSON.stringify(users));
    localStorage.setItem("papers",JSON.stringify(papers));
    localStorage.setItem("questions",JSON.stringify(questions));
}

// ====================== 首页 ======================
function home(){
    app.innerHTML=`
    <div class="card">
        <div class="title">全科智能刷题系统</div>
        <button class="btn" onclick="login()">学生登录</button>
        <button class="btn" onclick="reg()">注册账号</button>
        <button class="btn btn-light" onclick="adminLogin()">教师后台</button>
        <div class="tip">无邀请码请联系管理员付费开通</div>
    </div>`;
}

// ====================== 注册 ======================
function reg(){
    app.innerHTML=`
    <div class="card">
        <div class="title">账号注册</div>
        <input class="input" id="u" placeholder="账号">
        <input class="input" id="p" type="password" placeholder="密码">
        <input class="input" id="name" placeholder="姓名">
        <input class="input" id="code" placeholder="邀请码">
        <button class="btn" onclick="regGo()">注册</button>
        <button class="btn btn-light" onclick="pay()">付费开通</button>
        <button class="btn btn-light" onclick="home()">返回</button>
    </div>`;
}
function regGo(){
    let u=document.getElementById("u").value,p=document.getElementById("p").value,name=document.getElementById("name").value,code=document.getElementById("code").value;
    if(!u||!p||!name||!code)return alert("请完整填写");
    users.push({user:u,pwd:p,name:name,days:99999});
    save();alert("注册成功");login();
}

// ====================== 登录 ======================
function login(){
    app.innerHTML=`
    <div class="card">
        <div class="title">学生登录</div>
        <input class="input" id="u" placeholder="账号">
        <input class="input" id="p" type="password" placeholder="密码">
        <button class="btn" onclick="loginGo()">登录</button>
        <button class="btn btn-light" onclick="home()">返回</button>
    </div>`;
}
function loginGo(){
    let user=users.find(x=>x.user==document.getElementById("u").value&&x.pwd==document.getElementById("p").value);
    if(!user)return alert("账号密码错误");
    currentUser=user;student();
}

// ====================== 学生中心 ======================
function student(){
    app.innerHTML=`
    <div class="card">
        <div class="title">欢迎 ${currentUser.name}</title>
        <button class="btn" onclick="toExam('math')">数学刷题</button>
        <button class="btn" onclick="toExam('chinese')">语文刷题</button>
        <button class="btn" onclick="toExam('english')">英语刷题</button>
        <button class="btn btn-light" onclick="home()">退出</button>
    </div>`;
}
function toExam(sub){
    let list=papers.filter(x=>x.sub==sub);
    let h=`<div class="card"><div class="title">试卷</div>`;
    list.forEach(p=>{h+=`<button class="btn" onclick="start(${p.id})">${p.name}</button>`});
    h+=`<button class="btn btn-light" onclick="student()">返回</button></div>`;
    app.innerHTML=h;
}
function start(pid){
    let qs=questions.filter(x=>x.pid==pid);
    let h=`<div class="card"><div class="title">开始答题</div>`;
    qs.forEach((q,i)=>{
        h+=`<div style="margin:15px 0"><div>${i+1}、<span class="mj-parse">${q.title}</span></div>`;
        if(q.type==1){h+=`<div>A ${q.a}</div><div>B ${q.b}</div><div>C ${q.c}</div><div>D ${q.d}</div>`;}
        if(q.type==2){h+=`<div>A ${q.a}</div><div>B ${q.b}</div><div>C ${q.c}</div><div>D ${q.d}</div>`;}
        if(q.type==3){h+=`<div>○ 对   ○ 错</div>`;}
        if(q.type==4){h+=`<input class="input" placeholder="请输入答案">`;}
        h+=`</div>`;
    });
    h+=`<button class="btn btn-success" onclick="alert('提交成功');student()">提交</button></div>`;
    app.innerHTML=h;MathJax.typeset();
}

// ====================== 付费页面 ======================
function pay(){
    app.innerHTML=`
    <div class="card">
        <div class="title">会员开通</div>
        <div class="price-item">✅ 体验会员 9.9 元</div>
        <div class="price-item">✅ 月会员 38 元</div>
        <div class="price-item">✅ 季度会员 68 元</div>
        <div class="price-item">✅ 年度会员 128 元</div>
        <div class="price-item">✅ 永久会员 199 元</div>
        <img src="${PAY_QR_URL}" class="qrcode">
        <div class="text-center">微信：${WECHAT_ID}</div>
        <button class="btn btn-light" onclick="home()">返回</button>
    </div>`;
}

// ====================== 教师后台 ======================
function adminLogin(){
    app.innerHTML=`
    <div class="card">
        <div class="title">教师登录</div>
        <input class="input" id="pwd" type="password" placeholder="密码">
        <button class="btn" onclick="adminGo()">登录</button>
        <button class="btn btn-light" onclick="home()">返回</button>
    </div>`;
}
function adminGo(){
    if(document.getElementById("pwd").value==ADMIN_PASS)admin();
    else alert("密码错误");
}
function admin(){
    app.innerHTML=`
    <div class="card">
        <div class="title">管理中心</div>
        <button class="btn" onclick="addPaper()">新建试卷</button>
        <button class="btn" onclick="paperList()">管理试卷</button>
        <button class="btn btn-success" onclick="importFile()">📁 微信文件导入出题</button>
        <button class="btn btn-light" onclick="home()">退出</button>
    </div>`;
}

// ====================== 试卷 ======================
function addPaper(){
    let name=prompt("试卷名称");
    if(!name)return;
    papers.push({id:Date.now(),name:name,sub:"math"});
    save();alert("创建成功");paperList();
}
function paperList(){
    let h=`<div class="card"><div class="title">试卷列表</div>`;
    papers.forEach(p=>{h+=`<button class="btn" onclick="goPaper(${p.id})">${p.name}</button>`});
    h+=`<button class="btn btn-light" onclick="admin()">返回</button></div>`;
    app.innerHTML=h;
}

// ====================== 【核心：按题型自动切换界面】 ======================
function goPaper(pid){
    nowPaperId=pid;
    let type=1;
    let qs=questions.filter(x=>x.pid==pid);
    let h=`<div class="card"><div class="title">出题中心</div>`;
    h+=`
    <div class="tab">
        <button onclick="tab(1)" id="t1" class="active">单选题</button>
        <button onclick="tab(2)" id="t2">多选题</button>
        <button onclick="tab(3)" id="t3">判断题</button>
        <button onclick="tab(4)" id="t4">填空题</button>
    </div>
    <div id="type1">
        ${mathBar("title")}
        <input class="input" id="title" placeholder="题目">
        <input class="input" id="a" placeholder="选项A">
        <input class="input" id="b" placeholder="选项B">
        <input class="input" id="c" placeholder="选项C">
        <input class="input" id="d" placeholder="选项D">
        <input class="input" id="ans" placeholder="答案（A/B/C/D）">
    </div>
    <div id="type2" class="hide">
        ${mathBar("title2")}
        <input class="input" id="title2" placeholder="题目">
        <input class="input" id="a2" placeholder="选项A">
        <input class="input" id="b2" placeholder="选项B">
        <input class="input" id="c2" placeholder="选项C">
        <input class="input" id="d2" placeholder="选项D">
        <input class="input" id="ans2" placeholder="答案（如：AB）">
    </div>
    <div id="type3" class="hide">
        ${mathBar("title3")}
        <input class="input" id="title3" placeholder="题目">
        <input class="input" id="ans3" placeholder="答案（对/错）">
    </div>
    <div id="type4" class="hide">
        ${mathBar("title4")}
        <input class="input" id="title4" placeholder="题目">
        <input class="input" id="ans4" placeholder="答案">
    </div>
    <button class="btn btn-success" onclick="saveQ()">💾 一键保存题目</button>
    <button class="btn btn-light" onclick="paperList()">返回</button>
    <div style="margin-top:20px">`;
    qs.forEach(q=>{h+=`<div style="padding:10px;border-bottom:1px solid #eee"><span class="mj-parse">${q.title}</span></div>`;});
    h+=`</div></div>`;
    app.innerHTML=h;MathJax.typeset();
}

function tab(n){
    document.getElementById("type1").classList.add("hide");
    document.getElementById("type2").classList.add("hide");
    document.getElementById("type3").classList.add("hide");
    document.getElementById("type4").classList.add("hide");
    document.getElementById("t1").classList.remove("active");
    document.getElementById("t2").classList.remove("active");
    document.getElementById("t3").classList.remove("active");
    document.getElementById("t4").classList.remove("active");
    document.getElementById("type"+n).classList.remove("hide");
    document.getElementById("t"+n).classList.add("active");
}

// ====================== 【核心：一键保存】 ======================
function saveQ(){
    let t = document.querySelector(".tab button.active").innerText;
    let title,a,b,c,d,ans,type=0;

    if(t.includes("单选")){type=1;title=document.getElementById("title").value;a=document.getElementById("a").value;b=document.getElementById("b").value;c=document.getElementById("c").value;d=document.getElementById("d").value;ans=document.getElementById("ans").value;}
    if(t.includes("多选")){type=2;title=document.getElementById("title2").value;a=document.getElementById("a2").value;b=document.getElementById("b2").value;c=document.getElementById("c2").value;d=document.getElementById("d2").value;ans=document.getElementById("ans2").value;}
    if(t.includes("判断")){type=3;title=document.getElementById("title3").value;ans=document.getElementById("ans3").value;}
    if(t.includes("填空")){type=4;title=document.getElementById("title4").value;ans=document.getElementById("ans4").value;}

    if(!title||!ans)return alert("题目和答案不能为空");
    questions.push({id:Date.now(),pid:nowPaperId,type,title,a,b,c,d,ans});
    save();alert("✅ 出题成功！");goPaper(nowPaperId);
}

// ====================== 【核心：微信文件导入出题】 ======================
function importFile(){
    app.innerHTML=`
    <div class="card">
        <div class="title">微信文件导入出题</div>
        <div class="import-box">
            <div>📁 选择微信文件</div>
            <input type="file" id="file" style="margin-top:15px" accept="*">
            <div class="tip">支持：txt、word、题目文本</div>
        </div>
        <button class="btn btn-success" onclick="readFile()">✅ 导入并生成题目</button>
        <button class="btn btn-light" onclick="admin()">返回</button>
    </div>`;
}

function readFile(){
    let file=document.getElementById("file").files[0];
    if(!file)return alert("请选择文件");
    let reader=new FileReader();
    reader.onload=function(e){
        let text=e.target.result;
        let lines=text.split(/\n/);
        lines.forEach(line=>{
            if(line.trim().length<3)return;
            let arr=line.split(/\|/);
            let type=1,title=arr[0]||"",a=arr[1]||"",b=arr[2]||"",c=arr[3]||"",d=arr[4]||"",ans=arr[5]||"";
            questions.push({id:Date.now(),pid:nowPaperId,type,title,a,b,c,d,ans});
        });
        save();alert("✅ 导入完成，已自动生成所有题目！");admin();
    }
    reader.readAsText(file);
}

home();
</script>
</body>
</html>
